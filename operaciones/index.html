function save(){if(window.AGORA_OPS_BRIDGE?.ready){window.AGORA_OPS_BRIDGE.save(JSON.parse(JSON.stringify(db)));return true}toast('Inicia sesión y espera la conexión con Firestore para guardar.','error');return false}
function getPerson(id){return db.people.find(p=>p.id===id)}
function getVehicle(id){return db.vehicles.find(v=>v.id===id)}
function occupied(event,start,end,kind='vehiculo'){if(kind==='personal')return {start,end};const staff=event.staff||[],baseStart=dateMs(start)-Number(event.before||0)*60000,baseEnd=dateMs(end)+Number(event.after||0)*60000;const first=Math.min(baseStart,...staff.map(a=>dateMs(a.start)).filter(Number.isFinite)),last=Math.max(baseEnd,...staff.map(a=>dateMs(a.end)).filter(Number.isFinite));const travel=Math.max(0,Number(event.travelMin||0)),margin=Math.max(0,Number(event.routeBufferMin||0));return {start:isoLocal(new Date(first-(travel+margin)*60000)),end:isoLocal(new Date(last+travel*60000))}}
function shifted(s,minutes){return isoLocal(new Date(dateMs(s)+minutes*60000))}
function dayShift(s,days){const d=new Date(s);d.setDate(d.getDate()+days);return isoLocal(d)}

function checkEvent(e){const out=[];const ignored=e.id;for(const a of (e.staff||[])){let person=getPerson(a.personId);if(!person||!isActive(person)){out.push({kind:'inactivo',resource:'personal',resourceId:a.personId,msg:`${person?.name||'Personal inexistente'} no está activo.`});continue}let cur=occupied(e,a.start,a.end,'personal');for(const x of db.events){if(x.id===ignored||!reserved(x))continue;for(const b of (x.staff||[])){if(a.personId===b.personId){let other=occupied(x,b.start,b.end,'personal');if(overlap(cur.start,cur.end,other.start,other.end))out.push({kind:'staff',resource:'personal',resourceId:a.personId,msg:`${person.name}: empalme con «${x.title}» (${fmtDate(x.start)} ${fmtTime(b.start)}–${fmtTime(b.end)}).`});else{
 const same=(e.siteId&&e.siteId===x.siteId)||(eventLocation(e)&&eventLocation(e).trim().toLowerCase()===eventLocation(x).trim().toLowerCase());
 if(!same){
  let gap=0,needed=0;
  if(dateMs(cur.end)<=dateMs(other.start)){gap=(dateMs(other.start)-dateMs(cur.end))/60000;needed=Number(x.travelMin||0)>0?Number(x.travelMin||0)+Number(x.routeBufferMin||0):0}
  else if(dateMs(other.end)<=dateMs(cur.start)){gap=(dateMs(cur.start)-dateMs(other.end))/60000;needed=Number(e.travelMin||0)>0?Number(e.travelMin||0)+Number(e.routeBufferMin||0):0}
  if(needed>0&&gap<needed)out.push({kind:'ruta',resource:'traslado',resourceId:a.personId,msg:`${person.name}: tiempo insuficiente entre «${x.title}» y «${e.title}» (${Math.round(gap)} min disponibles / ${needed} min previstos). Ajusta ruta o asignación.`})
 }
};}}}for(const block of db.blocks){if(block.resourceType==='personal'&&block.resourceId===a.personId&&overlap(cur.start,cur.end,block.start,block.end))out.push({kind:'ausencia',resource:'personal',resourceId:a.personId,msg:`${person.name}: no disponible por ${block.reason} (${fmtDate(block.start)}).`})}}
for(const vid of (e.vehicles||[])){const vehicle=getVehicle(vid);if(!vehicle||!isActive(vehicle)){out.push({kind:'inactivo',resource:'vehiculo',resourceId:vid,msg:`${vehicle?.name||'Vehículo inexistente'} no está activo.`});continue}let cur=occupied(e,e.start,e.end);for(const x of db.events){if(x.id===ignored||!reserved(x))continue;if((x.vehicles||[]).includes(vid)){let other=occupied(x,x.start,x.end);if(overlap(cur.start,cur.end,other.start,other.end))out.push({kind:'vehiculo',resource:'vehiculo',resourceId:vid,msg:`${vehicle.name}: empalme con «${x.title}» (${fmtDate(x.start)} ${fmtTime(x.start)}–${fmtTime(x.end)}).`})}}for(const block of db.blocks){if(block.resourceType==='vehiculo'&&block.resourceId===vid&&overlap(cur.start,cur.end,block.start,block.end))out.push({kind:'mantenimiento',resource:'vehiculo',resourceId:vid,msg:`${vehicle.name}: no disponible por ${block.reason} (${fmtDate(block.start)}).`})}}
return out}
function allAlerts(){let out=[];for(const e of db.events.filter(x=>x.status!=='cancelado')){const c=checkEvent(e);for(const v of c){if(e.status==='borrador')continue;let sym=[e.id,v.kind,v.resourceId,v.msg.match(/«([^»]+)»/)?.[1]||''].join('|');out.push({...v,eventId:e.id,eventTitle:e.title,sym})}}let seen=new Set();return out.filter(v=>{if(seen.has(v.sym))return false;seen.add(v.sym);return true})}
function dailyHours(personId,day){let a=isoLocal(startOfDay(toDate(day))),b=isoLocal(plusDays(startOfDay(toDate(day)),1));return assignedHours(personId,a,b)}
function assignedHours(personId,start,end){return db.events.filter(reserved).reduce((sum,e)=>sum+(e.staff||[]).filter(s=>s.personId===personId).reduce((v,s)=>v+hDiff(Math.max(dateMs(start),dateMs(s.start)),Math.min(dateMs(end),dateMs(s.end))),0),0)}
function actualHours(personId,start,end){return db.logs.filter(l=>l.personId===personId).reduce((sum,l)=>{const s=Math.max(dateMs(start),dateMs(l.start)),e=Math.min(dateMs(end),dateMs(l.end));if(e<=s)return sum;let frac=(e-s)/(dateMs(l.end)-dateMs(l.start));return sum+Math.max(0,(e-s)/3600000-(Number(l.breakMins)||0)/60*frac)},0)}
function busyReason(type,id,start,end){let resource=type==='personal'?getPerson(id):getVehicle(id);if(!resource)return 'No existe';if(!isActive(resource))return 'Inactivo';for(const b of db.blocks){if(b.resourceType===type&&b.resourceId===id&&overlap(start,end,b.start,b.end))return `Bloqueado: ${b.reason}`}for(const e of db.events.filter(reserved)){if(type==='personal'){for(const a of e.staff||[]){if(a.personId===id){let occ=occupied(e,a.start,a.end,'personal');if(overlap(start,end,occ.start,occ.end))return `${e.title} · ${fmtTime(a.start)}–${fmtTime(a.end)}`}}}else if((e.vehicles||[]).includes(id)){let occ=occupied(e,e.start,e.end);if(overlap(start,end,occ.start,occ.end))return `${e.title} · ${fmtTime(e.start)}–${fmtTime(e.end)}`}}return ''}
function eventsInDay(d){const a=isoLocal(startOfDay(toDate(d)));const b=isoLocal(plusDays(startOfDay(toDate(d)),1));return db.events.filter(e=>e.status!=='cancelado'&&overlap(a,b,e.start,e.end)&&(ui.role!=='personal'||e.staff?.some(a=>a.personId===ui.personId))).sort((x,y)=>dateMs(x.start)-dateMs(y.start))}
function weekRange(){let st=monday(ui.cursor);return [isoLocal(st),isoLocal(plusDays(st,7))]}
function countAvail(type){const list=type==='personal'?db.people:db.vehicles;return list.filter(x=>!busyReason(type,x.id,ui.availabilityStart,ui.availabilityEnd)).length}
function toast(message,type=''){const outer=document.getElementById('toast-wrap');const n=document.createElement('div');n.className='toast '+type;n.textContent=message;outer.appendChild(n);setTimeout(()=>n.remove(),4000)}
function render(){const alerts=allAlerts();const [title,sub]=titles[ui.view]||titles.inicio;const staffMode=ui.role==='personal';const adminNav=['inicio','calendario','personal','pagos'];const extraNav=['asistencia','horas','rutas','disponibilidad','vehiculos','alertas'];const nav=staffMode?['mi_espacio','calendario','asistencia','horas']:adminNav;const names={inicio:'Hoy',calendario:'Calendario',disponibilidad:'Disponibilidad',rutas:'Rutas / traslados',personal:'Personal',vehiculos:'Vehículos',sedes:'Sucursales / sedes',campanas:'Campañas',asistencia:'Asistencia / retardos',horas:'Horas trabajadas',pagos:'Sueldos y pagos',alertas:'Conflictos',mi_espacio:'Mi espacio'};const viewFns={inicio:renderHome,calendario:renderCalendar,disponibilidad:renderAvailability,rutas:renderRoutes,personal:renderPeople,vehiculos:renderVehicles,sedes:renderSites,campanas:renderCampaigns,horas:staffMode?renderMyHours:renderHours,asistencia:renderAttendance,pagos:renderPayments,alertas:renderAlerts,mi_espacio:renderMySpace,configuracion:renderSettings};document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand"><div class="brand-identity"><img src="./assets/dejavu-horizontal.png" alt="Dejavú Marketing" width="194" height="70" loading="eager"></div><div class="brand-sub">ÁGORA · OPERACIÓN</div></div><div class="navlabel">AGENDA Y RECURSOS</div>${nav.map(v=>`<button class="nav-button ${ui.view===v?'active':''}" data-nav="${v}">${ico({sedes:'calendario',campanas:'inicio',rutas:'truck',pagos:'horas',asistencia:'check',mi_espacio:'personal'}[v]||v)}<span>${names[v]}</span>${v==='alertas'&&alerts.length?`<span class="side-count">${alerts.length}</span>`:''}</button>`).join('')}${staffMode?'':`<details class="ops-extra-nav" ${extraNav.includes(ui.view)?'open':''}><summary>Más opciones</summary>${extraNav.map(v=>`<button class="nav-button ${ui.view===v?'active':''}" data-nav="${v}">${ico({rutas:'truck',asistencia:'check',horas:'horas',disponibilidad:'calendario',vehiculos:'vehiculos',alertas:'alertas'}[v]||v)}<span>${names[v]}</span></button>`).join('')}</details><div class="navlabel">ADMINISTRACIÓN</div><button class="nav-button ${ui.view==='configuracion'?'active':''}" data-nav="configuracion">${ico('configuracion')}<span>Configuración / respaldo</span></button>`}<div class="side-bottom"><span class="side-tag">FIREBASE · ACCESO INDIVIDUAL</span><p>Solo cuentas autorizadas. La agenda y los sueldos se protegen por rol desde Firestore.</p></div></aside><main class="main"><header class="topbar"><div class="ops-page-titleline"><img class="ops-mobile-brand" src="./assets/dejavu-monograma.png" alt="Dejavú" width="52" height="52"><div><div class="eyebrow">DEJAVÚ MARKETING / CENTRO DE OPERACIONES · V3</div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div></div><div class="top-actions">${staffMode?'':'<button class="btn" type="button" data-action="ops-jornadas-control">Control de jornadas</button>'}<span class="pill gold">${staffMode?'Mi espacio · Cuenta personal':'Coordinación · Cuenta autorizada'}</span>${staffMode?'':btn(ico('download')+' Respaldo','export-json')}${staffMode?'':btn(ico('plus')+' Nuevo evento','new-event','btn-primary')}</div></header><div id="content">${(viewFns[ui.view]||renderHome)()}</div><div class="footnote">ÁGORA V4 · Datos compartidos mediante Firestore cuando las reglas están activas. Los avisos push con la aplicación cerrada aún no están habilitados. Los importes y retardos son sujetos a revisión.</div></main><nav class="mobile-nav">${(staffMode?['mi_espacio','calendario','asistencia','horas']:['inicio','calendario','rutas','asistencia','pagos','alertas']).map(v=>`<button data-nav="${v}" class="${ui.view===v?'active':''}">${ico({rutas:'truck',pagos:'horas',asistencia:'check',mi_espacio:'personal'}[v]||v)}${names[v]}</button>`).join('')}</nav>`;}
function renderHome(){let [weekStart,weekEnd]=weekRange();let thisWeek=db.events.filter(e=>e.status!=='cancelado'&&overlap(e.start,e.end,weekStart,weekEnd));let alerts=allAlerts();let future=db.events.filter(e=>e.status!=='cancelado'&&dateMs(e.end)>=Date.now()).sort((a,b)=>dateMs(a.start)-dateMs(b.start)).slice(0,6);let active=db.people.filter(isActive);const ws=isoLocal(monday(today)),we=isoLocal(plusDays(monday(today),7));let latenessCount=monthAttendanceRows().filter(r=>attendanceReviewFor(r.personId,r.e.id)?.status==='retardo').length;let pendingPayCount=db.logs.filter(l=>l.paymentStatus==='solicitado').length;return `<div class="ops-home-actions"><button class="btn btn-primary" data-action="new-event">+ Nueva jornada</button><button class="btn" data-nav="calendario">Ver calendario</button><button class="btn" data-nav="asistencia">Validar asistencia</button><button class="btn" data-nav="pagos">Revisar pagos</button></div>${renderOpsBoard()}<details class="ops-home-more"><summary>Más detalles e indicadores de la agencia</summary><div class="top-note">${ico('info')} <span>Esta versión sirve para organizar y probar las reglas de operación sin modificar datos ni módulos de la aplicación publicada.</span></div><div class="grid metric-grid kpi-six"><div class="metric"><div class="metric-label">Actividades de la semana ${ico('calendario')}</div><div class="metric-value">${thisWeek.length}</div><div class="metric-sub">${fmtDate(weekStart)} – ${fmtDate(new Date(dateMs(weekEnd)-86400000))}</div></div><div class="metric"><div class="metric-label">Personal disponible ${ico('personal')}</div><div class="metric-value">${countAvail('personal')}<span style="font-size:14px;color:#9c9c9c"> / ${db.people.length}</span></div><div class="metric-sub">En ventana ${fmtTime(ui.availabilityStart)}–${fmtTime(ui.availabilityEnd)}</div></div><div class="metric"><div class="metric-label">Vehículos disponibles ${ico('vehiculos')}</div><div class="metric-value">${countAvail('vehiculo')}<span style="font-size:14px;color:#9c9c9c"> / ${db.vehicles.length}</span></div><div class="metric-sub">En ventana ${fmtTime(ui.availabilityStart)}–${fmtTime(ui.availabilityEnd)}</div></div><div class="metric ${alerts.length?'bad':''}"><div class="metric-label">Conflictos por resolver ${ico('alertas')}</div><div class="metric-value">${alerts.length}</div><div class="metric-sub">${alerts.length?'Revisar antes de asignar':'Sin empalmes detectados'}</div></div><div class="metric"><div class="metric-label">Retardos de este mes</div><div class="metric-value">${latenessCount}</div><div class="metric-sub">Fuera de tolerancia</div></div><div class="metric"><div class="metric-label">Pagos por validar</div><div class="metric-value">${pendingPayCount}</div><div class="metric-sub">Solicitudes del personal</div></div></div><div class="grid split"><div><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Próximas actividades</h2><p class="panel-sub">Desde hoy, ordenadas por fecha y hora</p></div><button class="btn btn-small" data-nav="calendario">Ver cronograma</button></div><div class="panel-body">${future.length?future.map(e=>eventRow(e)).join(''):empty('Sin actividades próximas','Crea tu primera actividad para empezar a asignar recursos.','new-event','Crear actividad')}</div></section><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Carga del equipo esta semana</h2><p class="panel-sub">Horas programadas por persona · límite operativo ${db.settings.weeklyLimit} h</p></div><button class="btn btn-small" data-nav="horas">Ver horas</button></div><div class="panel-body">${active.length?active.slice(0,8).map(p=>{let hrs=assignedHours(p.id,ws,we);let over=hrs>Number(db.settings.weeklyLimit);return `<div class="summary-line"><span class="truncate" style="min-width:95px;font-weight:700">${esc(p.name)}</span><div class="hours-cell"><span>${fmtHours(hrs)} h</span><div class="bar-track"><div class="bar-fill ${over?'over':''}" style="width:${Math.min(100,hrs/Number(db.settings.weeklyLimit||48)*100)}%"></div></div></div></div>`}).join(''):empty('Aún no hay personal','Registra al equipo para conocer su carga de trabajo.','new-person','Agregar personal')}</div></section></div><div><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Centro de alertas</h2><p class="panel-sub">Empalmes detectados en tu planeación</p></div><span class="pill ${alerts.length?'red':'green'}">${alerts.length} alertas</span></div><div class="panel-body">${alerts.length?alerts.slice(0,5).map(alertRow).join(''):`<div class="empty">${ico('check')}<div class="empty-title">Todo en orden</div><p>No hay conflictos de horarios o recursos registrados.</p></div>`}${alerts.length>5?`<button class="btn btn-small wide" data-nav="alertas">Ver todas las alertas</button>`:''}</div></section><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Accesos rápidos</h2><p class="panel-sub">Altas y movimientos</p></div></div><div class="panel-body"><div class="grid" style="grid-template-columns:repeat(2,1fr);gap:9px">${btn(ico('personal')+' Personal','new-person')}${btn(ico('vehiculos')+' Vehículo','new-vehicle')}${btn(ico('alertas')+' Bloqueo','new-block')}${btn(ico('horas')+' Horas reales','new-log')}${btn('Asistencia y retardos','go-attendance')}${btn('Exportar calendario','export-ics')}${btn('Alertas en pestaña','notify-setup')}</div><p class="small muted" style="line-height:1.6;margin:15px 0 0">Primero registra el personal y los vehículos; después podrás asignarlos a actividades y verificar empalmes.</p>${!db.events.length&&!db.people.length?`<button class="btn btn-small btn-quiet" data-action="load-demo" style="margin-top:10px">Cargar datos de demostración</button>`:''}</div></section></div></div></details>`}function eventRow(e){let c=checkEvent(e).length;return `<div class="event-row"><div class="time-column">${fmtDate(e.start)}<br>${fmtTime(e.start)}</div><div class="accent ${c?'red':''}"></div><div class="event-detail"><div class="event-name">${esc(e.title)} <span class="pill gold">${esc(e.type||"Evento")}</span></div><div class="event-meta">${esc(e.project||"Sin proyecto")} · ${esc(e.campaign||"Sin campaña")} · ${esc(getSite(e.siteId)?.name||e.location||"Sin sede")}<br>${(e.staff||[]).map(a=>getPerson(a.personId)?.name||"Sin nombre").join(", ")||"Sin personal"} · ${(e.vehicles||[]).map(id=>getVehicle(id)?.name||id).join(", ")||"Sin vehículo"} · ${fmtHours(hDiff(e.start,e.end))} h de actividad</div></div><div class="event-right">${c?`<span class="pill red">${c} conflicto(s)</span>`:statusPill(operationalPhase(e))}<button class="btn btn-small btn-icon" title="Editar" data-action="edit-event" data-id="${esc(e.id)}">${ico('edit')}</button></div></div>`}
function alertRow(a){return `<div class="alert-row"><div class="alert-icon">${ico('alertas')}</div><div style="min-width:0;flex:1"><b>${esc(a.eventTitle)}</b><p>${esc(a.msg)}</p><button class="subtle-link" data-action="edit-event" data-id="${esc(a.eventId)}" style="margin-top:5px">Corregir actividad</button></div></div>`}
function calendarToolbar(){let dateTitle=ui.mode==='dia'?fmtLong(ui.cursor):ui.mode==='semana'?`${fmtDate(monday(ui.cursor))} – ${fmtDate(plusDays(monday(ui.cursor),6),{day:'2-digit',month:'short',year:'numeric'})}`:new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric'}).format(ui.cursor);return `<div class="cal-toolbar"><div class="inline-actions"><div class="calendar-title">${dateTitle}</div><div class="arrow-group">${btn('‹','cal-prev','btn-small')}${btn('Hoy','cal-today','btn-small')}${btn('›','cal-next','btn-small')}</div></div><div class="tabs">${[['dia','Día'],['semana','Semana'],['mes','Mes']].map(x=>`<button class="${ui.mode===x[0]?'selected':''}" data-mode="${x[0]}">${x[1]}</button>`).join('')}</div></div>`}
function renderCalendar(){return `<div class="inline-actions" style="margin-bottom:13px"><button class="btn btn-small" data-action="export-ics">${ico("download")} Exportar a Google / Outlook / Apple (.ICS)</button><button class="btn btn-small" data-action="notify-setup">${ico("alertas")} Activar alertas en esta pestaña</button></div><section class="panel">${calendarToolbar()}<div class="calendar">${ui.mode==='mes'?renderMonth():ui.mode==='semana'?renderWeek():renderDay()}</div></section><div style="margin-top:15px" class="inline-actions"><span class="pill gold">Asignación programada</span><span class="pill red">Con conflicto</span><span class="pill blue">En curso</span><span class="small muted">En semana o mes, arrastra una ficha a otro día. Los empalmes bloquean el cambio.</span></div>`}
function dayChips(d,limit=4){let es=eventsInDay(d);return es.slice(0,limit).map(e=>`<button class="cal-chip ${checkEvent(e).length?'red':e.status==='en_curso'?'blue':''}" draggable="true" data-drag-event="${esc(e.id)}" data-action="edit-event" data-id="${esc(e.id)}" title="Arrastra a otro día para reprogramar · ${esc(e.title)}">${fmtTime(e.start)} ${esc(e.title)}</button>`).join('')+(es.length>limit?`<span class="cal-more">+ ${es.length-limit} más</span>`:'')}
function renderMonth(){let first=new Date(ui.cursor.getFullYear(),ui.cursor.getMonth(),1);let start=monday(first);let numCells=Math.ceil((new Date(ui.cursor.getFullYear(),ui.cursor.getMonth()+1,0).getDate()+(first.getDay()+6)%7)/7)*7;let cells=[];for(let i=0;i<numCells;i++){let d=plusDays(start,i),day=isoDate(d);cells.push(`<div class="cal-cell ${d.getMonth()!==ui.cursor.getMonth()?'other':''} ${day===isoDate(today)?'today':''}" data-day="${day}"><span class="cal-date">${d.getDate()}</span>${dayChips(day,3)}</div>`)}return `<div class="cal-grid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="cal-weekday">${x}</div>`).join('')}${cells.join('')}</div>`}

function renderAvailability(){let valid=finiteDate(ui.availabilityStart)&&finiteDate(ui.availabilityEnd)&&dateMs(ui.availabilityEnd)>dateMs(ui.availabilityStart);let people=db.people.map(p=>({id:p.id,name:p.name,sub:p.role,type:'personal'}));let vehicles=db.vehicles.map(v=>({id:v.id,name:v.name,sub:v.plate||v.type,type:'vehiculo'}));return `<section class="panel"><div class="panel-header"><div><h2 class="panel-title">Consulta de disponibilidad</h2><p class="panel-sub">La hora se compara también con preparación y traslado de cada actividad.</p></div>${btn(ico('plus')+' Registrar ausencia / mantenimiento','new-block','btn-small')}</div><div class="availability-head"><label>Desde<input class="field" id="availability-start" type="datetime-local" value="${esc(ui.availabilityStart)}"></label><label>Hasta<input class="field" id="availability-end" type="datetime-local" value="${esc(ui.availabilityEnd)}"></label><button class="btn btn-primary" data-action="apply-availability">Consultar</button></div>${valid?`<div class="panel-body"><div class="kpi-inline" style="margin-bottom:16px"><div><b>${countAvail('personal')} / ${db.people.length}</b><small>PERSONAS LIBRES</small></div><div><b>${countAvail('vehiculo')} / ${db.vehicles.length}</b><small>VEHÍCULOS LIBRES</small></div><div><b>${fmtHours(hDiff(ui.availabilityStart,ui.availabilityEnd))} h</b><small>VENTANA CONSULTADA</small></div></div><div class="section-label">Personal</div>${people.length?`<div class="resource-list">${people.map(availabilityItem).join('')}</div>`:empty('Sin personal registrado','Agrega integrantes para evaluar su disponibilidad.','new-person','Agregar personal')}<div class="section-label">Vehículos</div>${vehicles.length?`<div class="resource-list">${vehicles.map(availabilityItem).join('')}</div>`:empty('Sin vehículos registrados','Registra unidades para verificar sus horarios.','new-vehicle','Agregar vehículo')}</div>`:`<div class="form-warning" style="margin:20px">La fecha final debe ser posterior a la /* Diferencia operativa entre turno asignado y horas netas reportadas.
 * Es una alerta, nunca una aprobación automática de horas extras ni de pago.
 */
function extraCandidate(log){
  const event=db.events.find(e=>e.id===log.eventId);
  const shift=(event?.staff||[]).find(a=>a.personId===log.personId);
  if(!shift||!shift.start||!shift.end)return null;
  const planned=hDiff(shift.start,shift.end),actual=logHours(log);
  if(!Number.isFinite(planned)||!Number.isFinite(actual)||planned<=0)return null;
  const extra=Math.max(0,actual-planned);
  if(extra<0.01)return null;
  return {event,planned,actual,extra};
}
function renderExtraReviewPanel(){
  const flagged=db.logs.map(log=>({log,info:extraCandidate(log)}))
    .filter(x=>x.info).sort((a,b)=>dateMs(b.log.start)-dateMs(a.log.start));
  return '<section class="panel ops-extra-panel">'+
    '<div class="panel-header"><div><h2 class="panel-title">Posibles horas extras por revisar</h2>'+
    '<p class="panel-sub">Comparación entre turno asignado y horas netas registradas; ninguna diferencia autoriza un pago.</p></div>'+
    '<span class="pill gold">'+flagged.length+' registro(s)</span></div>'+
    '<div class="panel-body">'+(flagged.length?
      '<div class="table-scroll"><table class="data-table"><thead><tr>'+
      '<th>Integrante</th><th>Evento / día</th><th>Programadas</th><th>Reportadas netas</th><th>Excedente por revisar</th><th>Estado</th><th>Acción</th>'+
      '</tr></thead><tbody>'+flagged.map(({log,info})=>
        '<tr><td><b>'+esc(getPerson(log.personId)?.name||"Persona no encontrada")+'</b></td>'+
        '<td>'+esc(info.event.title||info.event.type||"Actividad")+'<small>'+fmtDate(log.start)+'</small></td>'+
        '<td>'+fmtHours(info.planned)+' h</td>'+
        '<td>'+fmtHours(info.actual)+' h</td>'+
        '<td><span class="pill gold">+'+fmtHours(info.extra)+' h</span></td>'+
        '<td>'+payPill(log.paymentStatus||"capturado")+'</td>'+
        '<td><button class="btn btn-small" data-action="edit-log" data-id="'+esc(log.id)+'">Revisar horas</button></td></tr>'
      ).join('')+'</tbody></table></div>':
      '<p class="small muted">No hay reportes con excedentes sobre el turno asignado.</p>')+
    '<p class="footnote">«Validado» en el estado general no significa que se haya aprobado el excedente. La autorización específica de tiempo extraordinario se gestionará por coordinación.</p>'+
    '</div></section>';
}

sc(p.name)}<small>${esc(p.role||'')}</small></td><td>${fmtHours(plan)} h</td><td>${fmtHours(real)} h</td><td>${fmtHours(real-plan)} h</td><td><span class="pill ${weekly>db.settings.weeklyLimit?'red':'gold'}">${fmtHours(weekly)} / ${db.settings.weeklyLimit} h</span></td></tr>`}).join('')}</tbody></table></div>`:empty('Sin personal','Agrega personal antes de registrar jornadas.','new-person','Agregar personal')}<p class="footnote">* El límite semanal es un parámetro interno de alerta, no un cálculo de obligaciones laborales ni de nómina.</p></div></section><section class="panel" style="margin-top:16px"><div class="panel-header"><div><h2 class="panel-title">Bitácora de horas reales</h2><p class="panel-sub">Registro manual de inicio, fin, descansos y puntualidad respecto al evento</p></div></div><div class="panel-body">${db.logs.filter(l=>overlap(l.start,l.end,start,end)).length?db.logs.filter(l=>overlap(l.start,l.end,start,end)).sort((a,b)=>dateMs(b.start)-dateMs(a.start)).map(l=>`<div class="event-row"><div class="time-column">${fmtDate(l.start)}<br>${fmtTime(l.start)}</div><div class="accent"></div><div class="event-detail"><div class="event-name">${esc(getPerson(l.personId)?.name||'Personal eliminado')}</div><div class="event-meta">${fmtTime(l.start)}–${fmtTime(l.end)} · ${fmtHours(hDiff(l.start,l.end)-Number(l.breakMins||0)/60)} h netas · descanso ${l.breakMins||0} min<br>${esc(l.notes||'')}<br>${attendanceBadge(l)}</div></div><button class="btn btn-small" data-action="edit-log" data-id="${l.id}">Editar</button></div>`).join(''):empty('Sin registros de horas','La bitácora aparecerá cuando registres jornadas reales.','new-log','Registrar horas')}</div></section>`}
function renderAlerts(){let alerts=allAlerts();let blocks=db.blocks.slice().sort((a,b)=>dateMs(b.start)-dateMs(a.start));let warnings=[];for(let p of db.people.filter(isActive)){for(let i=0;i<28;i++){let day=plusDays(today,i);let val=dailyHours(p.id,isoDate(day));if(val>Number(db.settings.dailyLimit))warnings.push({name:p.name,day:isoDate(day),hours:val})}}return `<div class="grid split"><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Empalmes y recursos no disponibles</h2><p class="panel-sub">Los eventos confirmados se bloquean al guardar cuando tienen conflictos.</p></div><span class="pill ${alerts.length?'red':'green'}">${alerts.length} alertas</span></div><div class="panel-body">${alerts.length?alerts.map(alertRow).join(''):`<div class="empty">${ico('check')}<div class="empty-title">Sin empalmes detectados</div><p>No existen actividades activas con el mismo personal o vehículo en horarios que se crucen.</p></div>`}</div></section><div><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Ausencias y mantenimientos</h2><p class="panel-sub">Los bloqueos se toman en cuenta para asignaciones.</p></div>${btn(ico('plus')+' Bloqueo','new-block','btn-small')}</div><div class="panel-body">${blocks.length?blocks.map(b=>`<div class="event-row"><div class="event-detail"><div class="event-name">${esc(b.resourceType==='personal'?getPerson(b.resourceId)?.name:getVehicle(b.resourceId)?.name)||'Recurso no encontrado'}</div><div class="event-meta">${esc(b.reason)}<br>${fmtDate(b.start)} ${fmtTime(b.start)} a ${fmtDate(b.end)} ${fmtTime(b.end)}</div></div><button class="btn btn-small" data-action="edit-block" data-id="${b.id}">Editar</button></div>`).join(''):empty('Sin bloqueos','Registra vacaciones, ausencias o mantenimiento.','new-block','Crear bloqueo')}</div></section><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Carga diaria elevada</h2><p class="panel-sub">Próximos 28 días · más de ${db.settings.dailyLimit} h programadas</p></div></div><div class="panel-body">${warnings.length?warnings.slice(0,10).map(x=>`<div class="summary-line"><div><b>${esc(x.name)}</b><div class="small muted">${fmtDate(x.day+'T12:00')}</div></div><span class="pill red">${fmtHours(x.hours)} h</span></div>`).join(''):empty('Sin excesos detectados','No hay jornadas que rebasen el umbral interno configurado.')}</div></section></div></div>`}

function updateExistingAssignment(row){
 if(!row||!row.closest('#event-form'))return;
 const input=row.querySelector('[data-person-name]'),display=row.querySelector('[data-assignment-summary]');
 if(!input||!display)return;
 const norm=x=>String(x||'').trim().toLocaleLowerCase('es-MX');
 const possible=db.people.filter(p=>norm(p.name)===norm(input.value)&&isActive(p));
 if(possible.length!==1){display.hidden=true;display.textContent='';row.dataset.personId='';return}
 const person=possible[0];row.dataset.personId=person.id;
 const role=row.querySelector('[data-person-role]');if(role&&!role.value)role.value=person.role||'';
 const assignments=window.AGORA_JORNADA_UI?.existingAssignments(db,person.id,{
   excludeEventId:document.querySelector('#event-form')?.dataset.id||''
 })||[];
 if(!assignments.length){display.hidden=false;display.textContent='Sin otras asignaciones registradas para esta persona.';return}
 const fmt=a=>esc(a.day+' · '+a.title+' · '+fmtTime(a.start)+'–'+fmtTime(a.end)+(a.site?' · '+a.site:''));
 display.hidden=false;
 display.innerHTML='<details><summary>'+assignments.length+' asignacion(es) existentes · Ver calendario</summary>'+
 assignments.map(a=>'<div class="ops-existing-item">'+fmt(a)+'</div>').join('')+'</details>';
}

function read(id){return document.getElementById(id)?.value?.trim()||''}
function validPeriod(s,e){return finiteDate(s)&&finiteDate(e)&&dateMs(e)>dateMs(s)}
function handleSubmit(form){if(form.id==='event-form'){
  const title=read('ev-title'),start=read('ev-start'),end=read('ev-end'),status=read('ev-status');
  const prior=db.events.find(x=>x.id===form.dataset.id);
  const count=prior?1:Number(read('ev-days')||1);
  if(!title||!validPeriod(start,end)||(!prior&&dateMs(end)-dateMs(start)>86400000)||!Number.isInteger(count)||count<1||count>31){
    toast('Revisa título, fechas y número de jornadas.','error');return;
  }
  const norm=x=>String(x||'').trim().toLocaleLowerCase('es-MX');
  const staged={people:[],vehicles:[],sites:[]};
  const lookup=(kind,name,extra)=>{
    const key=norm(name);if(!key)return null;
    let item=[...db[kind],...staged[kind]].find(x=>norm(x.name)===key);
    if(!item){
      item={id:uid(),name,...extra};staged[kind].push(item);
    }
    return item;
  };
  const venueName=read('ev-site-name'),venueAddress=read('ev-site-address');
  const site=venueName?lookup('sites',venueName,{address:venueAddress,client:read('ev-project'),city:'',notes:''}):null;
  const staff=[],ids=new Set();
  for(const row of form.querySelectorAll('.direct-person-row')){
    const name=row.querySelector('[data-person-name]').value.trim();
    if(!name)continue;
    const matching=db.people.filter(p=>norm(p.name)===norm(name));
    if(matching.length>1){toast('Hay dos fichas con el nombre «'+name+'». Corrige la duplicidad antes de asignar.','error');return;}
    if(matching[0]&&!isActive(matching[0])){toast('La persona «'+name+'» está inactiva.','error');return;}
    if(!matching.length&&db.people.length&&!row.querySelector('[data-new-person]')?.checked){
      toast('Selecciona un nombre de las sugerencias. Si es nuevo, marca «Registrar como integrante nuevo».','error');row.querySelector('[data-person-name]').focus();return;
    }
    const person=matching[0]||lookup('people',name,{role:row.querySelector('[data-person-role]').value.trim(),active:true,hourRate:0,dayRate:0,phone:'',email:''});
    const st=row.querySelector('[data-person-start]').value,ed=row.querySelector('[data-person-end]').value;
    if(ids.has(person.id)){toast('Una persona no puede aparecer dos veces en la misma jornada.','error');return}
    if(!validPeriod(st,ed)||dateMs(st)<dateMs(start)-86400000||dateMs(ed)>dateMs(end)+86400000){
      toast('Corrige las horas de entrada y salida del personal.','error');return;
    }
    staff.push({personId:person.id,start:st,end:ed});ids.add(person.id);
  }
  const vehicles=[],vids=new Set();
  for(const row of form.querySelectorAll('.direct-vehicle-row')){
    const name=row.querySelector('[data-vehicle-name]').value.trim();
    if(!name)continue;
    const v=lookup('vehicles',name,{plate:row.querySelector('[data-vehicle-plate]').value.trim(),type:'Camioneta',capacity:2,active:true});
    if(vids.has(v.id)){toast('Esta unidad aparece repetida.','error');return}
    vehicles.push(v.id);vids.add(v.id);
  }
  const driverName=read('ev-driver-name');
  const driver=driverName?lookup('people',driverName,{role:'Conductor',active:true,hourRate:0,dayRate:0,phone:'',email:''}):null;
  if(driver&&!staff.some(a=>a.personId===driver.id)){
    toast('El conductor debe estar incluido entre el personal de esta jornada.','error');return;
  }
  const travelMin=Number(read('ev-travel')||0),routeBufferMin=Number(read('ev-route-margin')||0);
  if(!Number.isFinite(travelMin)||travelMin<0||travelMin>720||!Number.isFinite(routeBufferMin)||routeBufferMin<0||routeBufferMin>180){
    toast('Revisa minutos de traslado y margen.','error');return;
  }
  const original={...prior,id:form.dataset.id||uid(),title,project:read('ev-project'),campaign:read('ev-campaign'),
    siteId:site?.id||'',venueName,venueAddress,location:read('ev-location'),origin:read('ev-origin'),stops:read('ev-stops'),
    travelMin,routeBufferMin,staffBufferMin:document.getElementById('ev-auto')?.checked?30:0,
    driverId:driver?.id||'',type:read('ev-type'),workMode:read('ev-work-mode'),status,start,end,
    before:Number(prior?.before??30),after:Number(prior?.after??30),notes:read('ev-notes'),staff,vehicles};
  const seriesId=prior?.seriesId||original.id;
  const list=Array.from({length:count},(_,i)=>({
    ...original,id:i===0?original.id:uid(),seriesId,
    dayIndex:prior?.dayIndex||i+1,dayCount:prior?.dayCount||count,
    start:dayShift(original.start,i),end:dayShift(original.end,i),
    staff:original.staff.map(a=>({...a,start:dayShift(a.start,i),end:dayShift(a.end,i)}))
  }));
  const previous={events:db.events,people:db.people,vehicles:db.vehicles,sites:db.sites};
  db.people=[...previous.people,...staged.people];
  db.vehicles=[...previous.vehicles,...staged.vehicles];
  db.sites=[...previous.sites,...staged.sites];
  db.events=[...previous.events.filter(e=>!list.some(d=>d.id===e.id)),...list];
  let conflicts=[];
  try{
    for(const daily of list){
      if(daily.status==='borrador'||daily.status==='cancelado')continue;
      conflicts.push(...checkEvent(daily).map(c=>'Día '+daily.dayIndex+': '+c.msg));
    }
  }catch(e){conflicts.push('No fue posible comprobar asignaciones: '+e.message);}
  if(conflicts.length){
    Object.assign(db,previous);
    document.getElementById('event-validation').innerHTML='<div class="form-warning"><b>Revisa las jornadas:</b><br>'+
      conflicts.slice(0,12).map(x=>'• '+esc(x)).join('<br>')+'<br>Corrige o marca como borrador.</div>';
    document.querySelector('.modal-content').scrollTop=100000;return;
  }
  save();closeModal();render();
  toast(count===1?'Actividad guardada.':'Se crearon '+count+' jornadas diarias.');
  return;
}

async function estimateRouteFromForm(){
  const form=document.getElementById("event-form");
  if(!form)return;
  const origin=read("ev-origin"),destination=read("ev-site-address")||read("ev-site-name"),stops=read("ev-stops");
  const output=document.getElementById("ev-route-estimate-result"),button=document.getElementById("ev-estimate-free");
  if(!origin||!destination){toast("Indica origen y dirección de la sede para estimar el traslado.","error");return}
  if(/(?:\bcasa\b|domicilio particular|domicilio personal)/i.test(origin+" "+destination)){
    output.textContent="No envíes direcciones particulares al servicio público. Usa coordenadas o registra los minutos manualmente.";
    return;
  }
  const snapshot=[origin,destination,stops];
  button.disabled=true;output.textContent="Buscando direcciones públicas para estimar el tiempo sin costo…";
  try{
    const {estimatePublicRoute}=await import("./ops-route-estimate.mjs");
    const result=await estimatePublicRoute(...snapshot);
    if(document.getElementById("event-form")!==form||read("ev-origin")!==origin||
      (read("ev-site-address")||read("ev-site-name"))!==destination||read("ev-stops")!==stops){
      output.textContent="Cambiaste una ubicación. Vuelve a estimar el tiempo.";return;
    }
    document.getElementById("ev-travel").value=String(result.minutes);
    output.textContent="≈ "+result.minutes+" min (rango orientativo "+result.minMinutes+"–"+result.maxMinutes+
      " min). Distancia geográfica: "+result.distanceStraightKm+" km. Verifica los lugares: "+
      result.matches.map(x=>x.label).join(" → ")+". Sin tráfico ni ruta exacta por calles. Puedes editar el tiempo.";
    output.classList.add("ready");updateRouteDeparturePreview();
    toast("Tiempo orientativo aplicado; puedes editar los minutos.");
  }catch(error){
    output.textContent=String(error?.message||error)+
      " No se modificó el tiempo previo. Puedes introducir los minutos manualmente.";
    output.classList.remove("ready");
  }finally{button.disabled=false}
}
function updateRouteDeparturePreview(){
  const el=document.getElementById("ops-departure-preview");if(!el)return;
  const minutes=Number(read("ev-travel")||0),margin=Number(read("ev-route-margin")||0),start=read("ev-start");
  if(!validPeriod(start,read("ev-end"))||minutes<0||minutes>720||margin<0||margin>180){
    el.textContent="Introduce un horario válido para calcular la salida sugerida.";return;
  }
  el.textContent="Salida sugerida: "+fmtTime(shifted(start,-30-minutes-margin))+
    " · 30 min antes del evento + "+minutes+" min de traslado + "+margin+" min de margen.";
}

      const startTime=dateMs(e.start)<dateMs(dateStart)?'00:00':fmtTime(e.start);
      const endTime=dateMs(e.end)>dateMs(dateEnd)?'24:00':fmtTime(e.end);
      const count=Number(e.dayCount)>1?' · Día '+Number(e.dayIndex||1)+'/'+Number(e.dayCount):'';
      const url=routeUrl(e);
      return '<div class="ops-schedule-row '+(issue?'has-alert':'')+'">'+
        '<div class="when">'+startTime+'–'+endTime+'</div>'+
        '<div><div class="primary">'+esc(e.title||'Actividad')+'</div><div class="detail">'+esc(e.type||'Actividad')+esc(count)+'</div></div>'+
        '<div class="detail"><strong>'+esc(site)+'</strong><div>'+esc(e.campaign||e.project||'')+'</div></div>'+
        '<div class="detail">'+esc(staff.join(', ')||'Personal pendiente')+'<div>'+esc(cars.join(', ')||'Sin camioneta')+'</div></div>'+
        '<div class="detail travel-col">'+(Number(e.travelMin||0)>0?'Salida '+fmtTime(occupied(e,e.start,e.end).start)+' · '+Number(e.travelMin)+' min de ruta':'Traslado por definir')+'<div>'+esc(statusName[operationalPhase(e)]||operationalPhase(e)||'')+'</div></div>'+
        '<div class="actions"><button class="btn btn-small" data-action="edit-event" data-id="'+esc(e.id)+'">Ver ficha</button>'+
        (url?'<a class="btn btn-small" target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">Ruta</a>':'')+'</div></div>';
    }).join('')+'</section>');
 }
 return '<p class="ops-schedule-sum">'+events.length+' jornadas registradas · '+visibleDays+' días con actividad en el período seleccionado</p>'+
   '<div class="ops-schedule">'+(sections.length?sections.join(''):'<div class="empty"><div class="empty-title">No hay jornadas en este período</div><p>Elige otra fecha o registra una actividad.</p></div>')+'</div>';
}

/* Cronograma matricial: sucursales/actividades en filas y días en columnas. */
function renderOpsMatrix(events,first,days){
  const dates=Array.from({length:days},(_,i)=>plusDays(first,i));
  const groups=new Map();
  for(const event of events){
    const site=event.venueName||getSite(event.siteId)?.name||event.location||'Sede por definir';
    const key=[site,event.title,event.campaign||event.project||'',event.type||''].join('\u241f');
    if(!groups.has(key))groups.set(key,{site,title:event.title||event.type||'Actividad',campaign:event.campaign||event.project||'',type:event.type||'Actividad',events:[]});
    groups.get(key).events.push(event);
  }
  const statusClass={finalizado:'done',confirmado:'confirmed',en_curso:'running',pendiente:'pending',borrador:'draft'};
  const statusTag={finalizado:'Realizada',confirmado:'Confirmada',en_curso:'En curso',pendiente:'Por confirmar',borrador:'Borrador'};
  const rows=[...groups.values()].sort((a,b)=>a.site.localeCompare(b.site,'es-MX')||a.title.localeCompare(b.title,'es-MX'));
  const head='<thead><tr><th class="ops-matrix-sticky" scope="col">Sucursal / actividad</th>'+
    dates.map(d=>'<th scope="col"><span>'+esc(new Intl.DateTimeFormat('es-MX',{weekday:'short'}).format(d))+'</span><strong>'+esc(new Intl.DateTimeFormat('es-MX',{day:'2-digit',month:'short'}).format(d))+'</strong></th>').join('')+'</tr></thead>';
  const body=rows.map(row=>'<tr><th scope="row" class="ops-matrix-sticky">'+
    '<b>'+esc(row.site)+'</b><small>'+esc(row.title)+'</small>'+
    (row.campaign?'<small>'+esc(row.campaign)+'</small>':'')+'</th>'+
    dates.map(d=>{
      const start=isoLocal(d),end=isoLocal(plusDays(d,1));
      const same=row.events.filter(e=>overlap(e.start,e.end,start,end));
      if(!same.length)return '<td class="ops-matrix-empty" aria-label="Sin actividad">—</td>';
      return '<td>'+same.map(event=>{
        const style=statusClass[event.status]||'draft';
        const label=statusTag[event.status]||event.status||'Actividad';
        return '<button type="button" class="ops-matrix-event '+style+'" data-action="view-jornada" data-id="'+esc(event.id)+'" '+
          'title="'+esc(event.title+' · '+fmtTime(event.start)+'–'+fmtTime(event.end)+' · '+label)+'">'+
          '<b>'+esc(label)+'</b><small>'+esc(fmtTime(event.start))+'–'+esc(fmtTime(event.end))+'</small></button>';
      }).join('')+'</td>';
    }).join('')+'</tr>').join('');
  return '<div class="ops-matrix-legend" aria-label="Estados del cronograma">'+
    '<span class="done">Realizada</span><span class="confirmed">Confirmada</span>'+
    '<span class="running">En curso</span><span class="pending">Por confirmar</span><span class="draft">Borrador</span></div>'+
    '<div class="ops-matrix-scroll"><table class="ops-matrix" style="min-width:'+(245+days*126)+'px">'+head+
    '<tbody>'+(rows.length?body:'<tr><td colspan="'+(days+1)+'">No hay actividades asignadas a este periodo.</td></tr>')+
    '</tbody></table></div><p class="ops-matrix-help">Desliza horizontalmente para ver más fechas. Pulsa cualquier actividad para abrir su ficha.</p>';
}

imary" data-action="view-jornada" data-id="${esc(e.id)}">Vista de jornada</button><button class="btn btn-small" data-action="shift-event" data-id="${esc(e.id)}" data-minutes="30" title="Mover evento y turnos 30 minutos después">+30 min</button><button class="btn btn-small" data-action="event-ics" data-id="${esc(e.id)}" title="Añadir al calendario">${ico('calendario')}</button></div>${clash?`<div class="small danger-text">${clash} conflicto(s) por resolver</div>`:''}</article>`}).join(''):`<div class="empty"><div class="empty-title">No hay jornadas para este día</div><p>Registra una apertura, activación, campaña o jornada para completar el tablero.</p><button class="btn btn-primary btn-small" data-action="new-event">Crear evento</button></div>`}</div>`}</section>`}

function shiftEvent(id,deltaMinutes){if(ui.role!=='coordinador')return;let e=db.events.find(x=>x.id===id);if(!e)return;if(['finalizado','cancelado'].includes(e.status)){toast('Para mover un evento finalizado, edítalo desde la ficha.','error');return}const moved={...e,start:isoLocal(new Date(dateMs(e.start)+deltaMinutes*60000)),end:isoLocal(new Date(dateMs(e.end)+deltaMinutes*60000)),staff:(e.staff||[]).map(s=>({...s,start:isoLocal(new Date(dateMs(s.start)+deltaMinutes*60000)),end:isoLocal(new Date(dateMs(s.end)+deltaMinutes*60000))}))};let issues=checkEvent(moved);if(issues.length&&moved.status!=='borrador'){toast('Movimiento bloqueado: '+issues[0].msg,'error');return}db.events[db.events.findIndex(x=>x.id===id)]=moved;save();render();toast('Evento y turnos reprogramados.');}
function icsStamp(s){return new Date(s).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function icsDownload(events){const rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dejavu//Agora Planeacion//ES','CALSCALE:GREGORIAN'];for(const e of events){rows.push('BEGIN:VEVENT','UID:'+e.id+'@agora-dejavu.local','DTSTAMP:'+icsStamp(new Date().toISOString()),'DTSTART:'+icsStamp(e.start),'DTEND:'+icsStamp(e.end),'SUMMARY:'+icsEsc(e.title+' · '+(e.type||'Evento')),'LOCATION:'+icsEsc(eventLocation(e)),'DESCRIPTION:'+icsEsc('Campaña: '+(e.campaign||e.project||'')+' | Staff: '+(e.staff||[]).map(a=>getPerson(a.personId)?.name||'').join(', ')+' | Camionetas: '+(e.vehicles||[]).map(id=>getVehicle(id)?.name||'').join(', ')),'BEGIN:VALARM','TRIGGER:-PT'+Math.max(5,Number(db.settings.notificationMinutes||60))+'M','ACTION:DISPLAY','DESCRIPTION:ÁGORA · '+icsEsc(e.title),'END:VALARM','END:VEVENT')}rows.push('END:VCALENDAR');download('AGORA_agenda_'+isoDate(new Date())+'.ics',rows.join('\r\n'),'text/calendar;charset=utf-8');}
function changePaymentStatus(id,act){if(ui.role!=='coordinador')return;let l=db.logs.find(x=>x.id===id);if(!l)return;let status=l.paymentStatus||'capturado';if(act==='validate-pay'){if(status!=='solicitado')return;let h=logHours(l),amount=logTotal(l);if(!logRate(l)){toast('Asigna una tarifa al personal antes de validar.','error');return}let review=attendanceReviewFor(l.personId,l.eventId);
   if(!review||['pendiente','observacion'].includes(review.status)){toast('Primero valida manualmente la asistencia de esta jornada.','error');return}
   if(review.status==='falta'){toast('La jornada está marcada como falta; revisa antes de autorizar importes.','error');return}
   let unresolved=db.incidents.some(i=>i.personId===l.personId&&i.eventId===l.eventId&&i.type!=='validacion_asistencia'&&i.status==='pendiente');
   if(unresolved&&!confirm('Existen otras incidencias pendientes. ¿Confirmas que revisaste la jornada?'))return;const given=prompt('Importe aprobado (MXN), previa verificación de jornada y tarifa:',amount.toFixed(2));if(given===null)return;let approved=Number(given);if(!Number.isFinite(approved)||approved<0){toast('Monto inválido.','error');return}l.approvedHours=h;l.approvedAmount=Math.round(approved*100)/100;l.paymentStatus='validado';audit('Horas y sueldo validados',l)}else if(act==='return-pay'){if(status!=='solicitado')return;l.paymentStatus='revision';l.returnNote=prompt('Motivo de corrección para el integrante:','')||'';audit('Solicitud devuelta',l)}else if(act==='schedule-pay'){if(status!=='validado')return;const proposed=(l.paymentDueDate||new Date(Date.now()+7*86400000).toISOString().slice(0,10));
 const date=prompt('Fecha prevista de pago (AAAA-MM-DD):',proposed);
 if(date===null)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(new Date(date+'T12:00').getTime())){toast('Fecha prevista inválida.','error');return}
 l.paymentDueDate=date;l.paymentStatus='programado';audit('Pago programado para '+date,l)}else if(act==='mark-paid'){if(status!=='programado')return;if(!confirm('¿Confirmas que el pago se realizó fuera de esta herramienta?'))return;l.paymentStatus='pagado';audit('Pago marcado como realizado',l)}else return;save();render();toast('Estado de pago actualizado.')}
function requestPayment(id){let l=db.logs.find(x=>x.id===id);if(!l)return;if(ui.role==='personal'&&l.personId!==ui.personId)return;if(!['capturado','revision'].includes(l.paymentStatus||'capturado'))return;if(!l.eventId){toast('Vincula esta jornada a un evento antes de solicitar pago.','error');return}let e=db.events.find(x=>x.id===l.eventId);if(!e||!e.staff?.some(a=>a.personId===l.personId)){toast('La persona no figura asignada a ese evento. Pide a coordinación que revise.','error');return}if(ui.role!=='personal'&&!logRate(l)){toast('Coordina la tarifa por hora antes de solicitar pago.','error');return}if(!l.activity){toast('Describe la actividad realizada antes de solicitar pago.','error');return}l.requestedRate=ui.role==='personal'?null:logRate(l);l.requestedAmount=ui.role==='personal'?null:logTotal(l);l.requestedHours=logHours(l);l.paymentStatus='solicitado';audit('Pago solicitado por '+(ui.role==='personal'?'personal (demo)':'coordinación'),l);save();render();toast('Solicitud de pago registrada para revisión.');}

function plannedShiftForLog(l){const e=db.events.find(e=>e.id===l.eventId);const a=e?.staff?.find(a=>a.personId===l.personId);return a?{event:e,shift:a}:null}
function punctuality(l){const assigned=plannedShiftForLog(l);if(!assigned)return {kind:'sin_turno',late:0,early:0,extra:0,planned:null};const {shift}=assigned;const rawLate=Math.max(0,Math.round((dateMs(l.start)-dateMs(shift.start))/60000));const rawEarly=Math.max(0,Math.round((dateMs(shift.end)-dateMs(l.end))/60000));const extra=Math.max(0,Math.round((dateMs(l.end)-dateMs(shift.end))/60000));let late=rawLate>Number(db.settings.lateGraceMinutes??10);let early=rawEarly>Number(db.settings.earlyGraceMinutes??10);return {kind:late?'retardo':early?'salida_temprana':'puntual',late:rawLate,early:rawEarly,extra,planned:shift,isLate:late,isEarly:early}}
function attendanceReviewFor(personId,eventId){
 return db.incidents.find(x=>x.type==='validacion_asistencia'&&x.personId===personId&&x.eventId===eventId)||null;
}
function attendanceReviewKey(personId,eventId){
 let h=2166136261>>>0;
 for(const ch of String(personId)+'|'+String(eventId)){h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0}
 return 'asistencia_'+h.toString(16).padStart(8,'0');
}
function attendanceDecisionText(status){
 return ({pendiente:'Pendiente de validación',correcta:'Asistencia correcta',retardo:'Retardo validado',falta:'Falta validada',justificada:'Justificada',observacion:'Requiere aclaración'})[status]||'Pendiente de validación';
}
function showAttendanceReviewForm(key){

 const divider=key.indexOf('|'),personId=key.slice(0,divider),eventId=key.slice(divider+1);
 const e=db.events.find(x=>x.id===eventId),p=getPerson(personId);
 if(divider<1||!e||!p||!e.staff?.some(a=>a.personId===personId))return;
 const prior=attendanceReviewFor(personId,eventId),clock=(db.clocks||[]).find(c=>c.eventId===eventId&&c.personId===personId);
 const log=db.logs.find(l=>l.eventId===eventId&&l.personId===personId);
 const realStart=clock?.startedAt?fmtTime(clock.startedAt):log?.start?fmtTime(log.start):'Sin marcaje';
 const realEnd=clock?.endedAt?fmtTime(clock.endedAt):log?.end?fmtTime(log.end):'Sin marcaje';
 const choices=[['pendiente','Pendiente de revisar'],['correcta','Correcta'],['retardo','Retardo'],['falta','Falta'],['justificada','Justificada'],['observacion','Requiere aclaración']];
 const options=choices.map(x=>'<option value="'+x[0]+'" '+(prior?.status===x[0]?'selected':'')+'>'+x[1]+'</option>').join('');

   '<div class="top-note">Solo coordinación determina si es puntualidad, retardo o falta. No se descuentan importes automáticamente.</div>'+

   'Validar asistencia','La decisión es manual y queda ligada a la jornada.',true);
}
function attendanceBadge(l){

 return '<span class="pill '+(status==='correcta'||status==='justificada'?'green':status==='falta'||status==='retardo'?'red':'gold')+'">'+esc(attendanceDecisionText(status))+'</span>';

function attendanceRows(){
 let result=[];
 for(const e of db.events.filter(reserved))for(const a of e.staff||[]){
  const logs=db.logs.filter(l=>l.eventId===e.id&&l.personId===a.personId);
  const recent=logs.sort((x,y)=>Math.abs(dateMs(x.start)-dateMs(a.start))-Math.abs(dateMs(y.start)-dateMs(a.start)))[0]||null;
  const incidents=db.incidents.filter(i=>i.personId===a.personId&&i.eventId===e.id);
  const clock=(db.clocks||[]).find(c=>c.eventId===e.id&&c.personId===a.personId)||null;
  result.push({e,a,log:recent,clock,incidents,personId:a.personId});
 }
 return result;
}

 }

}
function monthAttendanceRows(){let [a,b]=monthBounds();return attendanceRows().filter(r=>overlap(r.a.start,r.a.end,a,b)).filter(r=>ui.role!=='personal'||r.personId===ui.personId).sort((x,y)=>dateMs(y.a.start)-dateMs(x.a.start))}
function showIncidentForm(id){let i=db.incidents.find(x=>x.id===id)||{id:'',personId:ui.role==='personal'?ui.personId:'',eventId:'',type:'retardo',notes:'',status:'pendiente'};if(ui.role==='personal'&&i.personId!==ui.personId)return;let es=db.events.filter(e=>e.staff?.some(a=>a.personId===i.personId||ui.role!=='personal'));modal(`<form id="incident-form" data-id="${esc(i.id)}"><div class="modal-content"><div class="top-note">Las incidencias requieren revisión de coordinación. No aplican descuentos automáticos a salarios.</div><div class="form-grid"><div class="form-group"><label>Integrante *</label><select id="inc-person" class="field" required>${db.people.filter(p=>ui.role!=='personal'||p.id===ui.personId).map(p=>`<option value="${esc(p.id)}" ${p.id===i.personId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="form-group"><label>Tipo *</label><select id="inc-type" class="field"><option value="retardo" ${i.type==='retardo'?'selected':''}>Retardo</option><option value="falta" ${i.type==='falta'?'selected':''}>Falta / ausencia</option><option value="salida" ${i.type==='salida'?'selected':''}>Salida anticipada</option><option value="permiso" ${i.type==='permiso'?'selected':''}>Permiso</option><option value="otro" ${i.type==='otro'?'selected':''}>Otra incidencia</option></select></div><div class="form-group full"><label>Evento / turno *</label><select id="inc-event" class="field" required><option value="">Selecciona un evento</option>${db.events.filter(e=>ui.role!=='personal'||e.staff?.some(a=>a.personId===ui.personId)).map(e=>`<option value="${esc(e.id)}" ${i.eventId===e.id?'selected':''}>${esc(e.title)} · ${fmtDate(e.start)}</option>`).join('')}</select></div><div class="form-group full"><label>Motivo / aclaración (sin datos médicos) *</label><textarea id="inc-notes" required class="field" rows="3">${esc(i.notes)}</textarea></div>${ui.role==='coordinador'?`<div class="form-group"><label>Validación de coordinación</label><select id="inc-decision" class="field"><option value="pendiente" ${i.status==='pendiente'?'selected':''}>Pendiente</option><option value="justificado" ${i.status==='justificado'?'selected':''}>Justificado</option><option value="no_justificado" ${i.status==='no_justificado'?'selected':''}>No justificado</option></select></div>`:''}</div></div><div class="modal-foot"><button class="btn" type="button" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar incidencia</button></div></form>`,i.id?'Revisar incidencia':'Reportar incidencia','Retardo · falta · salida · permiso',true)}
function reviewIncident(id,action){if(ui.role!=='coordinador')return;let i=db.incidents.find(i=>i.id===id);if(!i)return;i.status=action==='justify-incident'?'justificado':'no_justificado';i.updatedAt=new Date().toISOString();audit('Incidencia '+i.status,i);save();render();toast('Incidencia revisada. No se modificó el sueldo.');}
function renderAttendance(){let rows=monthAttendanceRows(),late=rows.filter(r=>attendanceReviewFor(r.personId,r.e.id)?.status==='retardo').length,early=rows.filter(r=>r.clock?.startedAt&&!r.clock?.endedAt).length,missing=rows.filter(r=>!attendanceReviewFor(r.personId,r.e.id)&&dateMs(r.a.start)<Date.now()).length,requested=db.incidents.filter(i=>i.status==='pendiente'&&(ui.role!=='personal'||i.personId===ui.personId));return `<div class="top-note">${ico('info')} <span>Se muestran las horas reales de entrada y salida del servidor. <b>No se califican automáticamente</b> retardos ni faltas. Coordinación revisa cada jornada y decide; ningún estado genera descuentos automáticos.</span></div><div class="grid metric-grid"><div class="metric"><div class="metric-label">Retardos validados</div><div class="metric-value">${late}</div><div class="metric-sub">Clasificados manualmente</div></div><div class="metric"><div class="metric-label">Entradas sin salida</div><div class="metric-value">${early}</div><div class="metric-sub">Registro incompleto</div></div><div class="metric"><div class="metric-label">Jornadas por revisar</div><div class="metric-value">${missing}</div><div class="metric-sub">No equivalen a faltas</div></div><div class="metric"><div class="metric-label">Incidencias pendientes</div><div class="metric-value">${requested.length}</div><div class="metric-sub">Por aclarar o justificar</div></div></div><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Asistencia por evento y persona</h2><p class="panel-sub">Turno previsto, marcajes reales y validación manual de coordinación</p></div><div class="inline-actions"><button class="btn btn-small btn-primary" data-action="new-incident">Reportar incidencia</button><button class="btn btn-small" data-action="export-attendance">CSV</button></div></div><div class="panel-body"><div class="filterline"><input type="month" id="hours-month" class="field" value="${esc(ui.hoursMonth)}"></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Persona / evento</th><th>Turno programado</th><th>Registro real</th><th>Validación</th><th>Justificaciones</th><th>Acciones</th></tr></thead><tbody>${rows.map(r=>{let p=getPerson(r.personId),ls=r.log,incs=r.incidents;return `<tr><td class="name-cell">${esc(p?.name||'Sin nombre')}<small>${esc(r.e.title)} · ${fmtDate(r.a.start)}</small></td><td>${fmtTime(r.a.start)}–${fmtTime(r.a.end)}</td><td>${r.clock?.startedAt?fmtTime(r.clock.startedAt)+' – '+(r.clock.endedAt?fmtTime(r.clock.endedAt):'Salida pendiente'):(ls?fmtTime(ls.start)+' – '+(ls.end?fmtTime(ls.end):'Salida pendiente'):'<span class="muted">Sin marcaje</span>')}</td><td>${attendanceStatus(r)}</td><td>${incs.map(i=>`<span class="pill ${i.status==='justificado'?'green':i.status==='no_justificado'?'red':'gold'}">${esc(i.type)} · ${esc(i.status)}</span>`).join(' ')||'<span class="muted small">—</span>'}</td><td><div class="inline-actions">${ls?`<button class="btn btn-small" data-action="edit-log" data-id="${esc(ls.id)}">Horas</button>`:''}${ui.role==='coordinador'?`<button class="btn btn-small btn-primary" data-action="review-attendance" data-id="${esc(r.personId+'|'+r.e.id)}">Validar</button>`:''}<button class="btn btn-small" data-action="new-incident">Incidencia</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No hay turnos programados en este mes.</td></tr>'}</tbody></table></div></div></section><section class="panel" style="margin-top:16px"><div class="panel-header"><div><h2 class="panel-title">Control de incidencias</h2><p class="panel-sub">Aclaraciones de retardos, faltas, permisos y salidas anticipadas</p></div></div><div class="panel-body">${db.incidents.filter(i=>ui.role!=='personal'||i.personId===ui.personId).length?db.incidents.filter(i=>ui.role!=='personal'||i.personId===ui.personId).map(i=>`<div class="event-row"><div class="event-detail"><b>${esc(getPerson(i.personId)?.name||'Personal')} · ${esc(i.type)} · ${esc(db.events.find(e=>e.id===i.eventId)?.title||'Evento')}</b><div class="event-meta">${esc(i.notes)}<br>Estado: ${esc(i.status)}</div></div><div class="inline-actions"><button class="btn btn-small" data-action="edit-incident" data-id="${esc(i.id)}">Revisar</button>${ui.role==='coordinador'&&i.status==='pendiente'?`<button class="btn btn-small" data-action="justify-incident" data-id="${esc(i.id)}">Justificar</button><button class="btn btn-small" data-action="reject-incident" data-id="${esc(i.id)}">No justificar</button>`:''}</div></div>`).join(''):empty('Sin incidencias reportadas','Aquí se verán las justificaciones y observaciones por turno.')}</div></section>`}
function downloadAttendanceCSV(){
 const rows=monthAttendanceRows();
 downloadCSV('AGORA_asistencia_'+ui.hoursMonth+'.csv',[
 ['Integrante','Evento','Fecha','Turno previsto inicio','Turno previsto fin','Entrada oficial','Salida oficial','Entrada reportada','Salida reportada','Validación de coordinación','Observaciones'],
 ...rows.map(r=>{const decision=attendanceReviewFor(r.personId,r.e.id);
 return [getPerson(r.personId)?.name||'',r.e.title,fmtDate(r.a.start),r.a.start,r.a.end,
 r.clock?.startedAt||'',r.clock?.endedAt||'',r.log?.start||'',r.log?.end||'',
 attendanceDecisionText(decision?.status),decision?.notes||''];
 })]);
}

const originalCheckEvent=checkEvent;
checkEvent=function(e){let base=originalCheckEvent(e),seen=new Set();for(const x of db.events){if(x.id===e.id||!reserved(x))continue;let sharedStaff=(e.staff||[]).filter(a=>x.staff?.some(b=>b.personId===a.personId));let sharedVehicle=(e.vehicles||[]).filter(id=>x.vehicles?.includes(id));if(!sharedStaff.length&&!sharedVehicle.length)continue;let left=eventLocation(e).trim().toLowerCase(),right=eventLocation(x).trim().toLowerCase();if(!left||!right||left===right)continue;let checks=[];for(let a of sharedStaff){let b=x.staff.find(b=>b.personId===a.personId);checks.push({label:getPerson(a.personId)?.name||'Personal',aStart:a.start,aEnd:a.end,bStart:b.start,bEnd:b.end})}for(let id of sharedVehicle)checks.push({label:getVehicle(id)?.name||'Vehículo',aStart:e.start,aEnd:e.end,bStart:x.start,bEnd:x.end});for(let z of checks){let gap,needed;if(dateMs(z.aEnd)<=dateMs(z.bStart)){gap=(dateMs(z.bStart)-dateMs(z.aEnd))/60000;needed=Number(x.travelMin||0)}else if(dateMs(z.bEnd)<=dateMs(z.aStart)){gap=(dateMs(z.aStart)-dateMs(z.bEnd))/60000;needed=Number(e.travelMin||0)}else continue;if(gap<needed){let key=z.label+'|'+x.id;if(seen.has(key))continue;seen.add(key);base.push({kind:'ruta',resource:'traslado',resourceId:key,msg:z.label+': traslado entre sedes insuficiente. Disponible '+Math.floor(gap)+' min, previsto '+needed+' min (configuración manual) con «'+x.title+'».'})}}}return base};
render();

window.AGORA_OPS_APP={
  reset(){db=blank();ui.view='inicio';ui.role='coordinador';ui.personId='';closeModal();render()},
  apply({db:remote,role,personId}){const first=ui.role!==role;
    db={...blank(),...remote,settings:{...blank().settings,...(remote.settings||{})}};
    ui.role=role;ui.personId=personId||'';
    if(first)ui.view=role==='personal'?'mi_espacio':'inicio';
    render();
  },
  getRole(){return ui.role},savePayrollDueDate(month,date){
    if(ui.role!=='coordinador'||!/^\d{4}-\d{2}$/.test(month)||date&&!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;
    db.settings.payrollPlan={...(db.settings.payrollPlan||{}),[month]:date};save();render();return true;
  },
  snapshot(){return JSON.parse(JSON.stringify(db))}
};
let lastPhaseSnapshot='';
setInterval(()=>{
  const next=db.events.map(e=>e.id+':'+operationalPhase(e)).join('|');
  if(next!==lastPhaseSnapshot){
    lastPhaseSnapshot=next;
    if(!document.hidden&&!document.querySelector('.modal-mask')&&(!window.AGORA_OPS_BRIDGE||window.AGORA_OPS_BRIDGE.ready))render();
  }
},30000);
window.AGORA_TEST={getState:()=>JSON.parse(JSON.stringify(db)),getConflicts:()=>allAlerts(),checkEvent,availability:busyReason,scheduledHours:assignedHours,requestPayment,changePaymentStatus,shiftEvent,logHours,routeUrl};
})();
</script>
