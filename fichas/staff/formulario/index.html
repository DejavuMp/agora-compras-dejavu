<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Formulario de Staff · Dejavú Marketing</title><style>
:root{font-family:Arial,sans-serif;color:#222;background:#f6f5f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.box{max-width:530px;background:#fff;border:1px solid #e6e1d6;border-radius:18px;padding:36px;box-shadow:0 12px 40px #1b180c10}.brand{color:#9e783b;letter-spacing:2px;font-size:11px;font-weight:800}.btn{display:inline-block;padding:13px 19px;color:#fff;background:#171817;border-radius:8px;text-decoration:none;font-weight:bold;margin:15px 0}.hint{color:#7f7c75;font-size:13px;line-height:1.7}h1{font-size:25px;letter-spacing:-.7px}p{line-height:1.55}
</style></head><body><section class="box"><div class="brand">DEJAVÚ MARKETING / STAFF</div><h1>Formulario de información de pago</h1><p id="status" aria-live="polite">Buscando el formulario vigente…</p><a class="btn" id="open" hidden target="_self" rel="noopener noreferrer">Abrir formulario vigente</a><p class="hint">Este enlace es permanente. Cuando la agencia cambie el formulario mensual, aquí se abrirá la versión actualizada.</p><a class="hint" href="../">Volver al archivo de fichas</a></section><script>
(function(){'use strict';
var status=document.getElementById('status'),btn=document.getElementById('open');
fetch('../config.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('Sin configuración');return r.json()}).then(function(d){
 var f=(Array.isArray(d.forms)?d.forms:[]).find(function(x){return x.id===d.activeFormId});
 if(!f||!f.url)throw Error('Aún no hay formulario activo');
 var u=new URL(f.url);if(u.protocol!=='https:')throw Error('Enlace no válido');
 status.textContent='Abriendo: '+(f.title||'Formulario vigente');btn.href=u.href;btn.hidden=false;
 window.location.replace(u.href);
}).catch(function(){status.textContent='El formulario no está disponible en este momento. Contacta al coordinador para obtener el enlace actualizado.'});
})();
</script></body></html>
