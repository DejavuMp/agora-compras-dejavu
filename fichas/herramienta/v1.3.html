QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};



// QRBitBuffer.js
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
    ],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );    
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

    getPatternPosition : function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

        return a;
    },

    getLengthInBits : function(mode, type) {

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};


window.DVMQRCode=QRCode;window.DVMQRErrorCorrectLevel=QRErrorCorrectLevel;
})();

/p></div>`}</div>`}
function renderTrash(){let gone=db.events.filter(e=>e.deleted);return `<div class="headline"><div><div class="eyebrow">ADMINISTRACIÓN</div><h1>Papelera</h1><p class="subheadline">Restauración y eliminación controlada. Se conserva el registro de acciones.</p></div></div><div class="card">${gone.length?`<div class="table-scroll"><table><thead><tr><th>Evento</th><th>Folio</th><th>Eliminado</th><th>Acciones</th></tr></thead><tbody>${gone.map(e=>`<tr><td>${E(e.name||'Sin nombre')}</td><td>${E(e.folio)}</td><td>${xdatetime(e.deletedAt)}</td><td><button class="btn compact" data-action="restore" data-id="${e.id}">Restaurar</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">▥</div>No hay fichas en la papelera.</div>`}</div><p class="tiny muted">Esta versión conserva la papelera y el historial local. Para gestionar borrado definitivo con usuarios y permisos hace falta un servidor.</p>`}
function renderCatalog(){return `<div class="headline"><div><div class="eyebrow">CONFIGURACIÓN · FUENTE ÚNICA</div><h1>Catálogos Ágora y Staff</h1><p class="subheadline">${db.projects.length} proyectos cargados desde Ágora o captura manual · ${db.staff.length} colaboradores en directorio Staff. No hay proyectos KFC de hojas externas precargados.</p></div><div class="btn-row"><button class="btn primary" data-action="import-agora-projects">↑ Importar proyectos de Ágora</button><button class="btn" data-action="import-staff">↑ Importar personal Staff</button><button class="btn" data-action="export-catalog">↓ Respaldar catálogos</button></div></div><div class="note" style="margin-bottom:16px"><b>Origen autorizado:</b> el catálogo de proyectos debe proceder del sistema Ágora Dejavú. Esta edición funciona sin internet y no puede consultar el listado de proyectos en vivo. Exporta los proyectos reales de Ágora como JSON o CSV y cárgalos aquí. La importación conserva los IDs originales y actualiza por ID sin crear duplicados. En el ZIP encontrarás una plantilla CSV para preparar la importación.</div><div class="dashboard-grid"><div class="card"><div class="section-title"><div><h2>Proyectos vinculables</h2><p>Autocompleta la ficha por ID y respeta el expediente original de Ágora.</p></div><button class="btn compact" data-action="catalog-add" data-kind="project">＋ Registro manual</button></div>${db.projects.length?`<div class="table-scroll"><table><thead><tr><th>ID Ágora</th><th>Proyecto</th><th>Cuenta</th><th>Origen</th><th></th></tr></thead><tbody>${db.projects.map(p=>`<tr><td>${E(p.id)}</td><td>${E(p.name)}</td><td>${E(p.account||'—')}</td><td><span class="pill">${E(p.sourceSystem==='AGORA'?'Archivo Ágora · sin verificación en línea':'Manual · por validar')}</span></td><td><button class="mini-icon-btn" data-action="catalog-delete" data-kind="project" data-id="${E(p.id)}">✕</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">▤</div><b>No hay proyectos de Ágora importados todavía.</b><p>Usa «Importar proyectos de Ágora». Por seguridad no sustituimos este catálogo por hojas operativas externas.</p></div>`}</div><div class="rows"><div class="card"><div class="section-title"><div><h2>Personal · Staff</h2><p>Directorio independiente, asignado por StaffID. No se utilizan contactos KFC como personal.</p></div><button class="btn compact primary" data-action="catalog-add" data-kind="staff">＋ Personal</button></div>${db.staff.length?`<div class="table-scroll"><table><thead><tr><th>StaffID</th><th>Nombre</th><th>Rol</th><th></th></tr></thead><tbody>${db.staff.map(p=>`<tr><td>${E(p.id)}</td><td>${E(p.name)}</td><td>${E(p.role||'—')}</td><td><button class="mini-icon-btn" data-action="catalog-delete" data-kind="staff" data-id="${E(p.id)}">✕</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">♙</div>Sin StaffID reales disponibles. Puedes agregar o importar personal.</div>`}</div><div class="note"><b>Protección:</b> los proyectos que agregues manualmente estarán marcados como pendientes de validar. Importar el catálogo auténtico desde Ágora los actualizará por ID. Ningún dato se transmite a Ágora automáticamente; esta versión guarda todo en el navegador.</div></div></div>`}
function renderWizard(){let e=getEv();if(!e){ui.view='dashboard';return renderDashboard()}let c=countNeeds(e);return `<div class="headline"><div><div class="eyebrow">${E(e.folio)} · EDICIÓN</div><h1>${E(e.name||'Nueva ficha de evento')}</h1><div class="flex tiny muted"><span>${statusTag(e.status)}</span><span>Versión ${e.versions.length+1} (borrador)</span><span>·</span><span>Guardado local automático</span></div></div><div class="btn-row"><button class="btn" data-action="save-version">Guardar versión</button><button class="btn" data-action="event-preview">Vista previa</button><button class="btn primary" data-action="open-schedule">◷ Time Table</button></div></div><div class="wizard-layout"><div class="card step-nav">${STEPS.map((s,i)=>`<button class="step-link ${i===ui.step?'active':''}" data-action="step" data-step="${i}"><span>${String(i+1).padStart(2,'0')}</span>${s}</button>`).join('')}<div class="divider"></div><div class="tiny muted">Preparación de datos</div><div class="progress-track" style="margin:11px 0"><div class="progress-fill" style="width:${c.pct}%"></div></div><div class="tiny" style="font-weight:800">${c.pct}% de información básica</div></div><div class="card step-card">${ui.step===0?stepOne(e):ui.step===1?stepTwo(e):ui.step===2?stepThree(e):ui.step===3?stepFour(e):ui.step===4?stepFive(e):ui.step===5?stepSix(e):stepSeven(e)}<div class="step-actions"><button class="btn" data-action="prev-step" ${ui.step===0?'disabled':''}>← Anterior</button><div class="btn-row"><button class="btn" data-action="save-version">Guardar</button><button class="btn primary" data-action="next-step">${ui.step===6?'Volver al inicio →':'Continuar →'}</button></div></div></div></div>`}
function stepOne(e){return `<h2>01 · Identificación general</h2><p class="muted">Elige el evento y vincúlalo con un ID de proyecto. Si no existe, completa los datos manualmente.</p><div class="form-grid">${sel('Tipo de evento','event.type',e.type,TYPES,'Seleccionar tipo')}${f('Nombre del evento *','event.name',e.name,'text','placeholder="Ej. Apertura KFC Galerías Coapa"')}<div class="wide block" style="margin:0"><div class="block-title"><h3>Vincular con Ágora / Proyecto</h3><span class="pill">Ágora · Catálogo local</span></div><div class="flex" style="align-items:end"><div class="field" style="flex:1;min-width:200px"><label>ID del proyecto</label><input data-field="event.projectId" list="catalog-project-ids" value="${E(e.projectId)}" placeholder="Escribe o selecciona ID"><datalist id="catalog-project-ids">${db.projects.map(p=>`<option value="${E(p.id)}">${E(p.name)}</option>`).join('')}</datalist></div><button class="btn" data-action="lookup-project">Buscar ID</button><button class="btn" data-action="clear-project">Sin proyecto</button></div><p class="tiny muted">Los IDs deben venir de Ágora. Si aún no aparecen, entra a «Catálogos e IDs» e importa el listado real de proyectos.</p></div>${f('Cuenta / Cliente','event.account',e.account,'text','placeholder="Ej. KFC México"')}${f('Campaña','event.campaign',e.campaign)}${f('Coordinador de proyecto','event.coordinator',e.coordinator)}${f('Presentación de referencia (URL)','event.presentation',e.presentation,'url','placeholder="https://..."')}${area('Objetivo y descripción del evento','event.objective',e.objective,'class="wide"')}${area('Observaciones internas','event.notes',e.notes,'class="wide"')}</div>`}
function stepTwo(e){const venueOpts=e.venues.map(v=>({value:v.id,label:v.name||'Sede por definir'}));return `<h2>02 · Sucursales, jornadas y horarios</h2><p class="muted">Un mismo evento puede incluir varias sucursales y varios días por sucursal. Cada jornada tendrá actividades independientes.</p><div class="section-title"><div><h2>Sucursales y sedes (${e.venues.length})</h2></div><button class="btn compact primary" data-action="add" data-group="venues">＋ Agregar sucursal</button></div><div class="rows">${e.venues.map((v,i)=>`<div class="row-card"><div class="row-head"><strong>Sede ${i+1} · ${E(v.name||'Nueva sucursal')}</strong><button class="mini-icon-btn danger" data-action="remove" data-group="venues" data-id="${v.id}" title="Eliminar sede">✕</button></div><div class="form-grid">${f('Sucursal / sede *',entityField('venues',v.id,'name'),v.name)}${f('Domicilio',entityField('venues',v.id,'address'),v.address)}${f('Enlace Google Maps',entityField('venues',v.id,'mapsUrl'),v.mapsUrl,'url','placeholder="https://maps.google.com/..."')}${f('Ubicación del stand dentro de la sede',entityField('venues',v.id,'spot'),v.spot,'text','placeholder="Entre columnas / acceso principal..."')}${f('Imagen o croquis (URL)',entityField('venues',v.id,'imageUrl'),v.imageUrl,'url')}${f('Notas de acceso',entityField('venues',v.id,'notes'),v.notes)}</div>${link(v.mapsUrl)?`<div class="flex" style="margin-top:13px"><div class="qr-wrap">${qrSVG(v.mapsUrl)}</div><div><div class="small" style="font-weight:800">QR de ubicación</div><div class="tiny muted">Escanear para abrir el enlace proporcionado.</div><a href="${E(link(v.mapsUrl))}" target="_blank" rel="noopener noreferrer">Abrir mapa ↗</a></div></div>`:''}</div>`).join('')}</div><div class="section-title" style="margin-top:27px"><div><h2>Jornadas (${e.days.length})</h2><p>Programa tantos días como sea necesario por sucursal.</p></div><div class="btn-row"><button class="btn compact" data-action="duplicate-day" ${!e.days.length?'disabled':''}>⧉ Duplicar última</button><button class="btn primary compact" data-action="add" data-group="days" ${!e.venues.length?'disabled':''}>＋ Agregar jornada</button></div></div>${!e.days.length?`<div class="note">Agrega la primera jornada. Podrás añadir actividades por hora en el Time Table.</div>`:''}<div class="rows">${e.days.map((d,i)=>`<div class="row-card"><div class="row-head"><strong>Jornada ${i+1}: ${xdate(d.date)} · ${E(rowObject(e,'venues',d.venueId)?.name||'Sede sin nombre')}</strong><div class="btn-row"><button class="btn compact" data-action="day-schedule" data-id="${d.id}">◷ Actividades (${e.activities.filter(a=>a.dayId===d.id).length})</button><button class="mini-icon-btn danger" data-action="remove" data-group="days" data-id="${d.id}">✕</button></div></div><div class="fields-three">${sel('Sucursal',entityField('days',d.id,'venueId'),d.venueId,venueOpts)}${f('Fecha *',entityField('days',d.id,'date'),d.date,'date')}${f('Ubicación específica / espacio',entityField('days',d.id,'place'),d.place)}${f('Inicio de actividades',entityField('days',d.id,'start'),d.start,'time')}${f('Fin de actividades',entityField('days',d.id,'end'),d.end,'time')}${f('Horario de montaje',entityField('days',d.id,'mountStart'),d.mountStart,'time')}${f('Fin de montaje',entityField('days',d.id,'mountEnd'),d.mountEnd,'time')}${f('Inicio desmontaje',entityField('days',d.id,'teardownStart'),d.teardownStart,'time')}${f('Fin desmontaje',entityField('days',d.id,'teardownEnd'),d.teardownEnd,'time')}</div><div style="margin-top:10px">${f('Notas de la jornada',entityField('days',d.id,'notes'),d.notes)}</div></div>`).join('')}</div><div class="note" style="margin-top:15px"><b>Time Table:</b> al hacer clic en «Actividades» podrás asignar hora, lugar, tarea y responsable. El cronograma y el calendario se generan de forma automática.</div>`}
function reqOptions(e){return e.days.map(d=>({value:d.id,label:`${xdate(d.date)} · ${rowObject(e,'venues',d.venueId)?.name||'Sede sin nombre'}`}))}
function stepThree(e){const staffNotice=db.staff.length?'':`<div class="note" style="margin-bottom:12px"><b>Directorio Staff pendiente:</b> aún no hay IDs de Staff verificados. Puedes ingresar personal manualmente, o ir a Catálogos e IDs → Importar catálogos. Los contactos CON-xxx no son IDs de Staff.</div>`;const days=reqOptions(e);return `${staffNotice}<h2>03 · Personal requerido y asignaciones</h2><p class="muted">Indica el rol y la cantidad por jornada. El sistema crea las plazas automáticamente; después asigna los nombres o IDs disponibles.</p><div class="section-title"><h2>Requerimientos por jornada</h2><button class="btn primary compact" data-action="add" data-group="requirements" ${!e.days.length?'disabled':''}>＋ Rol requerido</button></div>${!e.days.length?'<div class="warning">Primero agrega al menos una jornada en el paso 02.</div>':''}<div class="table-scroll"><table><thead><tr><th>Jornada</th><th>Personal / Rol</th><th>Cantidad</th><th></th></tr></thead><tbody>${e.requirements.map(r=>`<tr><td class="data-cell"><select data-field="${entityField('requirements',r.id,'dayId')}">${opt(days,r.dayId)}</select></td><td class="data-cell"><select data-field="${entityField('requirements',r.id,'role')}">${opt(ROLES,r.role)}</select></td><td class="data-cell"><input type="number" min="0" max="40" data-field="${entityField('requirements',r.id,'qty')}" value="${number(r.qty)}" style="width:90px"></td><td><button class="mini-icon-btn danger" data-action="remove" data-group="requirements" data-id="${r.id}">✕</button></td></tr>`).join('')}</tbody></table></div><div class="section-title" style="margin-top:28px"><div><h2>Plazas y asignación (${e.assignments.length})</h2><p>Escribe el ID para completar el nombre desde el catálogo local.</p></div><button class="btn compact" data-action="sync-slots">↻ Actualizar plazas</button></div>${!e.assignments.length?`<div class="note">Al agregar un requerimiento aparecerán aquí los espacios de asignación.</div>`:''}<div class="rows">${e.assignments.map((a,i)=>`<div class="row-card"><div class="row-head"><div><strong>${i+1}. ${E(a.role)}</strong> <span class="pill">${xdate(rowObject(e,'days',a.dayId)?.date)}</span></div>${a.name?'<span class="pill green">Asignado</span>':'<span class="pill yellow">Por asignar</span>'}</div><div class="fields-three">${f('ID de personal',entityField('assignments',a.id,'personId'),a.personId,'text','placeholder="ID de Staff"')}${f('Nombre',entityField('assignments',a.id,'name'),a.name,'text','placeholder="Nombre completo"')}${f('Teléfono',entityField('assignments',a.id,'phone'),a.phone,'tel')}${f('Actividad principal',entityField('assignments',a.id,'activity'),a.activity,'text','placeholder="Breve descripción"')}${f('Inicio',entityField('assignments',a.id,'start'),a.start,'time')}${f('Fin',entityField('assignments',a.id,'end'),a.end,'time')}</div><div class="btn-row" style="margin-top:10px"><button class="btn compact" data-action="lookup-staff" data-id="${a.id}">Buscar ID en catálogo</button></div></div>`).join('')}</div>${conflicts(e).length?`<div class="warning-list" style="margin-top:15px">${conflicts(e).map(x=>`<div class="warning">⚠ ${E(x)}</div>`).join('')}</div>`:''}`}
function stepFour(e){const opts=reqOptions(e);return `<h2>04 · Montaje y desmontaje</h2><p class="muted">Se activa únicamente cuando el evento requiere operación técnica. Registra checklists, accesos, herramientas y responsables.</p><div class="block"><div class="flex between"><label class="toggle-line"><input type="checkbox" data-field="event.requiresMount" ${e.requiresMount?'checked':''}> <b>Requiere montaje</b></label><label class="toggle-line"><input type="checkbox" data-field="event.requiresTeardown" ${e.requiresTeardown?'checked':''}> <b>Requiere desmontaje</b></label></div></div>${(e.requiresMount||e.requiresTeardown)?`<div class="section-title"><h2>Checklists técnicos</h2><div class="btn-row"><button class="btn compact" data-action="check-template">Cargar tareas sugeridas</button><button class="btn primary compact" data-action="add" data-group="checklist">＋ Nueva tarea</button></div></div><div class="rows">${e.checklist.map(c=>`<div class="row-card"><div class="row-head"><label class="toggle-line"><input type="checkbox" data-field="${entityField('checklist',c.id,'done')}" ${c.done?'checked':''}><strong>${E(c.label||'Pendiente sin nombre')}</strong></label><button class="mini-icon-btn danger" data-action="remove" data-group="checklist" data-id="${c.id}">✕</button></div><div class="fields-three">${f('Tarea',entityField('checklist',c.id,'label'),c.label)}${sel('Fase',entityField('checklist',c.id,'phase'),c.phase,['Montaje','Desmontaje','General'])}${sel('Jornada',entityField('checklist',c.id,'dayId'),c.dayId,opts,'Todas las jornadas')}${f('Responsable',entityField('checklist',c.id,'person'),c.person)}${f('Observación',entityField('checklist',c.id,'notes'),c.notes)}</div></div>`).join('')}</div><div class="note" style="margin-top:16px">Los horarios de montaje y desmontaje se capturan por jornada en el paso 02 y aparecerán en el Time Table.</div>`:`<div class="empty"><div class="empty-icon">⚒</div><b>No requiere montaje o desmontaje</b><p>Esta etapa se omitirá en la ficha si no se activa alguna de las opciones.</p></div>`}`}
function stepFive(e){return `<h2>05 · Materiales, herramientas y transporte</h2><p class="muted">Controla cantidades planeadas y entregadas, pendientes y vehículos asociados a cada jornada.</p><div class="section-title"><h2>Lista de artículos (${e.items.length})</h2><button class="btn primary compact" data-action="add" data-group="items">＋ Agregar artículo</button></div><div class="table-scroll"><table><thead><tr><th>Artículo / Material</th><th>Planeado</th><th>Entregado</th><th>Restante</th><th>Responsable</th><th></th></tr></thead><tbody>${e.items.map(i=>`<tr><td class="data-cell wide-input"><input data-field="${entityField('items',i.id,'name')}" value="${E(i.name)}" placeholder="Ej. Cupones"></td><td class="data-cell"><input type="number" min="0" data-field="${entityField('items',i.id,'qty')}" value="${number(i.qty)}"></td><td class="data-cell"><input type="number" min="0" data-field="${entityField('items',i.id,'delivered')}" value="${number(i.delivered)}"></td><td><b>${Math.max(0,number(i.qty)-number(i.delivered))}</b></td><td class="data-cell"><input data-field="${entityField('items',i.id,'responsible')}" value="${E(i.responsible)}" placeholder="Responsable"></td><td><button class="mini-icon-btn danger" data-action="remove" data-group="items" data-id="${i.id}">✕</button></td></tr>`).join('')}</tbody></table></div><div class="section-title" style="margin-top:29px"><h2>Vehículos y transportes (${e.vehicles.length})</h2><button class="btn primary compact" data-action="add" data-group="vehicles">＋ Agregar vehículo</button></div><div class="rows">${e.vehicles.map((v,i)=>`<div class="row-card"><div class="row-head"><strong>Vehículo ${i+1}: ${E(v.plate||'Sin placas')}</strong><button class="mini-icon-btn danger" data-action="remove" data-group="vehicles" data-id="${v.id}">✕</button></div><div class="fields-three">${f('Placas',entityField('vehicles',v.id,'plate'),v.plate)}${f('Conductor',entityField('vehicles',v.id,'driver'),v.driver)}${f('Teléfono',entityField('vehicles',v.id,'phone'),v.phone,'tel')}${f('Marca / modelo',entityField('vehicles',v.id,'model'),v.model)}${f('Color',entityField('vehicles',v.id,'color'),v.color)}${sel('Jornada',entityField('vehicles',v.id,'dayId'),v.dayId,reqOptions(e),'Todas las jornadas')}${f('Imagen (URL)',entityField('vehicles',v.id,'imageUrl'),v.imageUrl,'url')}${f('Notas de acceso',entityField('vehicles',v.id,'notes'),v.notes)}</div></div>`).join('')}</div>`}
function stepSix(e){return `<h2>06 · Documentos, planos y visuales</h2><p class="muted">Agrega enlaces a Drive, Canva, presentaciones, planos, fotos, constructivos y otros recursos. Elige quién puede ver cada archivo.</p><div class="section-title"><h2>Documentos vinculados (${e.docs.length})</h2><button class="btn primary compact" data-action="add" data-group="docs">＋ Agregar documento</button></div><div class="rows">${e.docs.map((d,i)=>`<div class="row-card"><div class="row-head"><strong>${i+1}. ${E(d.label||'Documento')}</strong><button class="mini-icon-btn danger" data-action="remove" data-group="docs" data-id="${d.id}">✕</button></div><div class="form-grid">${sel('Tipo',entityField('docs',d.id,'kind'),d.kind,DOC_KINDS)}${f('Título del archivo',entityField('docs',d.id,'label'),d.label)}${f('Enlace público o autorizado',entityField('docs',d.id,'url'),d.url,'url')}${sel('Visibilidad',entityField('docs',d.id,'visibility'),d.visibility,[{value:'internal',label:'Solo agencia'},{value:'client',label:'Cliente y agencia'},{value:'staff',label:'Staff y agencia'},{value:'all',label:'Todos'}],'')}</div></div>`).join('')}</div><div class="note" style="margin-top:16px">Los enlaces externos conservarán sus permisos originales. Un enlace no hace que el archivo se vuelva público. Revisa autorizaciones antes de compartirlo.</div>`}
function stepSeven(e){let c=countNeeds(e);return `<h2>07 · Vista previa y exportación</h2><p class="muted">Revisa los datos, genera diferentes vistas y exporta el evento. Todos los archivos salen de una misma ficha.</p>${c.pending.length?`<div class="warning-list">${c.pending.map(w=>`<div class="warning">⚠ ${E(w)}</div>`).join('')}</div>`:''}<div class="toolbar"><div class="tabs" style="margin:0">${[['internal','Interna'],['client','Cliente'],['staff','Staff']].map(([k,n])=>`<button class="tab ${ui.preview===k?'active':''}" data-action="preview-variant" data-variant="${k}">${n}</button>`).join('')}</div><select data-special="event-status" aria-label="Estado de la ficha">${opt(STATUSES,e.status,'')}</select></div>${ui.preview==='staff'?renderStaffPicker(e):''}<div class="btn-row" style="margin-bottom:20px"><button class="btn" data-action="print">◫ Imprimir / PDF</button><button class="btn" data-action="export-image">▧ PNG</button><button class="btn" data-action="export-html">↗ Vista HTML</button><button class="btn primary" data-action="export-agora">⇩ Paquete Ágora (ligero)</button><button class="btn" data-action="export-event">⇩ Respaldo de ficha JSON</button><button class="btn" data-action="export-csv">▦ Time Table CSV</button></div>${sheetHTML(e,ui.preview)}<div class="form-header-notice" style="margin-top:15px">ⓘ Las vistas HTML exportadas son copias estáticas. Para enlaces con confirmaciones y actualizaciones en tiempo real se necesita publicar la aplicación con servidor.</div>`}
function renderStaffPicker(e){let assigns=e.assignments.filter(a=>a.name||a.personId);return `<div class="field" style="max-width:450px;margin-bottom:15px"><label>Seleccionar ficha individual de staff</label><select data-special="staff-select">${opt([{value:'all',label:'Todos (vista operativa)'},...assigns.map(a=>({value:a.id,label:`${a.name||a.personId} — ${a.role}`}))],ui.staffSelect,'')}</select></div>`}
function activitiesFor(e,dayId){return e.activities.filter(a=>a.dayId===dayId).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
function scheduleItems(e,d){let items=activitiesFor(e,d.id).map(a=>({...a,source:'activity'}));const place=d.place||rowObject(e,'venues',d.venueId)?.name||'';if(d.mountStart)items.push({start:d.mountStart,end:d.mountEnd,name:'Montaje',place,role:'Equipo de montaje',status:'Programada',source:'automatic'});if(d.teardownStart)items.push({start:d.teardownStart,end:d.teardownEnd,name:'Desmontaje',place,role:'Equipo de desmontaje',status:'Programada',source:'automatic'});if(!items.length&&d.start)items.push({start:d.start,end:d.end,name:'Jornada operativa',place,role:'Personal asignado',status:'Programada',source:'automatic'});return items.sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
function allScheduleItems(e){return e.days.flatMap(d=>scheduleItems(e,d).map(a=>({...a,date:d.date,venue:rowObject(e,'venues',d.venueId)?.name||'',dayId:d.id}))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))}
function conflicts(e){let errors=[];for(let i=0;i<e.assignments.length;i++)for(let j=i+1;j<e.assignments.length;j++){let a=e.assignments[i],b=e.assignments[j],ad=rowObject(e,'days',a.dayId),bd=rowObject(e,'days',b.dayId);if(!ad||!bd||!ad.date||ad.date!==bd.date)continue;if(!(a.personId||a.name))continue;if((a.personId&&a.personId===b.personId)||(a.name&&a.name.toLowerCase()===b.name.toLowerCase())){let start1=a.start||ad.start,end1=a.end||ad.end,start2=b.start||bd.start,end2=b.end||bd.end;if(start1&&end1&&start2&&end2&&start1<end2&&start2<end1)errors.push(`${a.name||a.personId} tiene asignaciones superpuestas el ${xdate(ad.date)}.`)}}return [...new Set(errors)]}
function sheetHTML(e,variant='internal',plain=false){let internal=variant==='internal',client=variant==='client',staff=variant==='staff',selected=ui.staffSelect==='all'?null:e.assignments.find(a=>a.id===ui.staffSelect);const approvedDocs=e.docs.filter(d=>internal||d.visibility==='all'||(client&&d.visibility==='client')||(staff&&d.visibility==='staff'));const assignments=staff?(selected?[selected]:e.assignments):internal?e.assignments:[];let name=client?'FICHA GENERAL DE EVENTO':staff?'INSTRUCCIONES DE ACTIVIDAD':'FICHA OPERATIVA';let rows=e.days.slice().sort((a,b)=>a.date.localeCompare(b.date)).filter(d=>!staff||!selected||selected.dayId===d.id);let totalStaff=e.requirements.reduce((s,r)=>s+number(r.qty),0);return `<article class="preview-sheet"><div class="sheet-top"><div><div class="sheet-logo">dejavú<span style="color:#e4b43c">.</span></div><div class="tiny muted" style="margin-top:6px;letter-spacing:1.6px">MARKETING EXPERIENCIAL</div></div><div class="text-right"><div style="font-size:12px;font-weight:850">${name}</div><div class="tiny muted">${E(e.folio)}</div><div class="tiny muted">${xdate(e.createdAt?.slice(0,10))}</div></div></div><h2 style="font-size:25px;letter-spacing:-.5px;margin:0 0 4px">${E(e.name||'Evento sin nombre')}</h2><div class="small muted">${E(e.type)} · ${E(e.account||'Cuenta pendiente')}${e.campaign?' · '+E(e.campaign):''}</div><div class="sheet-section"><h3>Información general</h3><div class="sheet-grid"><div class="sheet-item"><span>Cliente / Cuenta</span><strong>${E(e.account||'—')}</strong></div><div class="sheet-item"><span>Tipo de evento</span><strong>${E(e.type)}</strong></div><div class="sheet-item"><span>Jornadas</span><strong>${rows.length}</strong></div><div class="sheet-item"><span>Responsable</span><strong>${E(e.coordinator||'—')}</strong></div></div>${e.objective?`<p class="small" style="line-height:1.6">${E(e.objective)}</p>`:''}</div><div class="sheet-section"><h3>Cronograma general · Por sucursal y jornada</h3><div class="table-scroll"><table class="sheet-table"><thead><tr><th>Fecha</th><th>Sucursal</th><th>Horario</th><th>Actividad / Ubicación</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${xdate(d.date)}</td><td>${E(rowObject(e,'venues',d.venueId)?.name||'Sede por definir')}</td><td>${E(d.start||'—')} – ${E(d.end||'—')}</td><td>${E(d.place||'—')}</td></tr>`).join('')||'<tr><td colspan="4">Sin jornadas programadas.</td></tr>'}</tbody></table></div></div><div class="sheet-section"><h3>Time Table · Horarios, lugares y actividades</h3><div class="table-scroll"><table class="sheet-table"><thead><tr><th>Fecha</th><th>Hora</th><th>Actividad</th><th>Lugar</th><th>Responsable</th></tr></thead><tbody>${rows.flatMap(d=>scheduleItems(e,d).map(a=>`<tr><td>${xdate(d.date)}</td><td>${E(a.start||'—')}${a.end?'–'+E(a.end):''}</td><td>${E(a.name||'Actividad')}</td><td>${E(a.place||d.place||rowObject(e,'venues',d.venueId)?.name||'—')}</td><td>${E(a.role||'—')}</td></tr>`)).join('')||'<tr><td colspan="5">Sin actividades registradas.</td></tr>'}</tbody></table></div></div>${staff?`<div class="sheet-section"><h3>${selected?'Mi asignación':'Personal programado'}</h3><div class="table-scroll"><table class="sheet-table"><thead><tr><th>Jornada</th><th>Personal</th><th>Rol</th><th>Actividad</th><th>Horario</th></tr></thead><tbody>${assignments.map(a=>`<tr><td>${xdate(rowObject(e,'days',a.dayId)?.date)}</td><td>${E(a.name||'Pendiente')}</td><td>${E(a.role)}</td><td>${E(a.activity||'—')}</td><td>${E(a.start||'—')}–${E(a.end||'—')}</td></tr>`).join('')||'<tr><td colspan="5">Sin personal asignado.</td></tr>'}</tbody></table></div></div>`:''}${(internal||client)&&e.requirements.length?`<div class="sheet-section"><h3>Recursos humanos requeridos ${client?'por función':''}</h3><p class="small">Total de plazas de todas las jornadas: <b>${totalStaff}</b></p><div class="small">${e.requirements.map(r=>`${E(r.role)} (${number(r.qty)}) · ${xdate(rowObject(e,'days',r.dayId)?.date)}`).join(' · ')}</div></div>`:''}${internal&&e.assignments.length?`<div class="sheet-section"><h3>Personal asignado</h3><div class="table-scroll"><table class="sheet-table"><thead><tr><th>Día</th><th>Rol</th><th>Personal</th><th>Horario</th><th>Actividad</th></tr></thead><tbody>${e.assignments.map(a=>`<tr><td>${xdate(rowObject(e,'days',a.dayId)?.date)}</td><td>${E(a.role)}</td><td>${E(a.name||'Pendiente')}</td><td>${E(a.start||'—')}–${E(a.end||'—')}</td><td>${E(a.activity||'—')}</td></tr>`).join('')}</tbody></table></div></div>`:''}${internal&&(e.requiresMount||e.requiresTeardown)?`<div class="sheet-section"><h3>Montaje y desmontaje / Checklist</h3><div class="small">${e.checklist.map(c=>`<div style="padding:5px 0">${c.done?'☑':'☐'} ${E(c.phase)} · ${E(c.label)} ${c.person?'— '+E(c.person):''}</div>`).join('')||'Sin checklist registrado.'}</div></div>`:''}${internal&&e.items.length?`<div class="sheet-section"><h3>Materiales y entregas</h3><div class="table-scroll"><table class="sheet-table"><thead><tr><th>Artículo</th><th>Planeado</th><th>Entregado</th><th>Restante</th></tr></thead><tbody>${e.items.map(i=>`<tr><td>${E(i.name)}</td><td>${number(i.qty)}</td><td>${number(i.delivered)}</td><td>${Math.max(0,number(i.qty)-number(i.delivered))}</td></tr>`).join('')}</tbody></table></div></div>`:''}${internal&&e.vehicles.length?`<div class="sheet-section"><h3>Transporte y accesos</h3><div class="small">${e.vehicles.map(v=>`<p>${E(v.plate||'Sin placas')} · ${E(v.driver||'Conductor por confirmar')} · ${E(v.model||'—')} · ${E(v.color||'—')}</p>`).join('')}</div></div>`:''}${approvedDocs.length?`<div class="sheet-section"><h3>Documentos y enlaces</h3><div class="small">${approvedDocs.map(d=>`<p><b>${E(d.kind)}:</b> ${link(d.url)?`<a href="${E(link(d.url))}" target="_blank" rel="noopener noreferrer">${E(d.label||d.url)}</a>`:E(d.label||'Sin enlace')}</p>`).join('')}</div></div>`:''}${e.venues.some(v=>link(v.mapsUrl))?`<div class="sheet-section"><h3>Ubicaciones</h3><div class="sheet-grid">${e.venues.filter(v=>rows.some(d=>d.venueId===v.id)).map(v=>`<div><div class="small" style="font-weight:750;margin-bottom:6px">${E(v.name||'Sede')}</div><div class="tiny muted">${E(v.address||v.spot||'')}</div>${link(v.mapsUrl)?`<div style="margin-top:12px" class="qr-wrap">${qrSVG(v.mapsUrl)}</div>`:''}</div>`).join('')}</div></div>`:''}<div class="footerline">DEJAVÚ MARKETING · ${E(e.folio)} · ${E(variant.toUpperCase())} · ${E(e.status)}${!plain?' · Documento generado desde la ficha digital':''}</div></article>`}
function qrSVG(url){try{if(!link(url)||typeof DVMQRCode==='undefined')return '<small>QR no disponible</small>';const qr=new DVMQRCode(0,DVMQRErrorCorrectLevel.M);qr.addData(url);qr.make();const n=qr.getModuleCount(),size=n+8;let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" role="img" aria-label="Código QR"><rect width="${size}" height="${size}" fill="white"/>`;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))s+=`<rect x="${x+4}" y="${y+4}" width="1" height="1" fill="#202020"/>`;return s+'</svg>'}catch(err){return '<small>Enlace demasiado largo para QR</small>'}}
function renderSchedule(){let available=db.events.filter(e=>!e.deleted&&!e.archived),e=evById(ui.programEvent)||available[0];if(e&&!ui.programEvent)ui.programEvent=e.id;if(!e)return `<div class="headline"><div><div class="eyebrow">PROGRAMACIÓN</div><h1>Cronograma y Time Table</h1></div></div><div class="card empty"><div class="empty-icon">◷</div><h3>Sin eventos programados</h3><p>Crea una ficha y agrega sucursales y jornadas.</p><button class="btn primary" data-action="new">Nueva ficha</button></div>`;const activeVenue=ui.activeVenue;if(ui.activeDay&&!e.days.some(d=>d.id===ui.activeDay))ui.activeDay='';const visibleDays=e.days.filter(d=>activeVenue==='all'||d.venueId===activeVenue).sort((a,b)=>a.date.localeCompare(b.date));let chosenDay=visibleDays.find(d=>d.id===ui.activeDay)||visibleDays[0];let activities=chosenDay?scheduleItems(e,chosenDay):[];let month=ui.calendarDate||dayToday().slice(0,7),[yr,mo]=month.split('-').map(Number);if(!(yr>2000&&mo>=1&&mo<=12)){yr=new Date().getFullYear();mo=new Date().getMonth()+1}let first=(new Date(yr,mo-1,1).getDay()+6)%7,last=new Date(yr,mo,0).getDate();let dayCells=[];for(let i=0;i<42;i++){let n=i-first+1,valid=n>0&&n<=last,dstr=valid?`${yr}-${String(mo).padStart(2,'0')}-${String(n).padStart(2,'0')}`:'';let mapped=visibleDays.filter(d=>d.date===dstr);dayCells.push(`<div class="cal-day ${!valid?'dim':''} ${ui.calendarSelected===dstr?'selected':''}" ${valid?`data-action="calendar-day" data-date="${dstr}"`:''}><span class="cal-num">${valid?n:''}</span>${mapped.slice(0,2).map(d=>`<span class="cal-event" title="${E(rowObject(e,'venues',d.venueId)?.name||'Sede')}">${E(short(rowObject(e,'venues',d.venueId)?.name||'Jornada',16))}</span>`).join('')}${mapped.length>2?`<span class="tiny">+${mapped.length-2}</span>`:''}</div>`)}return `<div class="headline"><div><div class="eyebrow">PROGRAMACIÓN POR SEDE Y DÍA</div><h1>Cronograma y Time Table</h1><p class="subheadline">La vista por calendario y la línea de tiempo salen de las mismas jornadas y actividades.</p></div><div class="btn-row"><button class="btn" data-action="export-csv" data-id="${e.id}">↓ CSV</button><button class="btn primary" data-action="edit" data-id="${e.id}" data-step="1">Editar jornadas</button></div></div><div class="toolbar"><select id="program-event" aria-label="Seleccionar evento">${opt(available.map(x=>({value:x.id,label:`${x.name||x.folio} · ${x.folio}`})),e.id,'')}</select><select id="program-venue" aria-label="Seleccionar sucursal">${opt([{value:'all',label:'Todas las sucursales'},...e.venues.map(v=>({value:v.id,label:v.name||'Sede sin nombre'}))],activeVenue,'')}</select><button class="btn" data-action="add-activity" data-id="${e.id}" ${!e.days.length?'disabled':''}>＋ Actividad por hora</button></div><div class="dashboard-grid"><div class="card"><div class="section-title"><h2>Calendario mensual</h2><div class="btn-row"><button class="btn compact" data-action="month" data-shift="-1">‹</button><span class="small" style="font-weight:800">${new Date(yr,mo-1,12).toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</span><button class="btn compact" data-action="month" data-shift="1">›</button></div></div><div class="calendar">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-head">${d}</div>`).join('')}${dayCells.join('')}</div><p class="tiny muted" style="margin-top:10px">Selecciona un día para ver sus jornadas. Las fechas con actividad aparecen resaltadas.</p></div><div class="card"><div class="section-title"><h2>Jornadas registradas</h2><span class="pill">${visibleDays.length} jornada(s)</span></div><div class="rows">${visibleDays.length?visibleDays.map(d=>`<button class="quick-tile" style="min-height:69px;background:${chosenDay?.id===d.id?'#fff7e4':'#fdfdfa'}" data-action="select-day" data-id="${d.id}"><strong>${xdate(d.date)} · ${E(rowObject(e,'venues',d.venueId)?.name||'Sede')}</strong><div class="tiny muted">${E(d.start||'—')} – ${E(d.end||'—')} · ${e.activities.filter(a=>a.dayId===d.id).length} actividad(es)</div></button>`).join(''):'<div class="empty">No hay jornadas para el filtro actual.</div>'}</div>${conflicts(e).length?`<div class="warning-list" style="margin-top:15px">${conflicts(e).map(x=>`<div class="warning">⚠ ${E(x)}</div>`).join('')}</div>`:''}</div></div><div class="card" style="margin-top:18px"><div class="section-title"><div><h2>Time Table ${chosenDay?'· '+xdate(chosenDay.date):''}</h2><p>${chosenDay?E(rowObject(e,'venues',chosenDay.venueId)?.name||'Sede sin nombre'):'Selecciona una jornada para ver actividades'}</p></div><div class="btn-row"><button class="btn compact" data-action="duplicate-activities" data-id="${chosenDay?.id||''}" ${!chosenDay?'disabled':''}>⧉ Copiar actividades a otro día</button><button class="btn primary compact" data-action="add-activity" data-id="${e.id}" data-day="${chosenDay?.id||''}" ${!chosenDay?'disabled':''}>＋ Actividad</button></div></div>${activities.length?`<div class="timeline">${activities.map(a=>`<div class="timeline-item"><div class="time">${E(a.start||'Sin hora')}${a.end?' — '+E(a.end):''}</div><div class="flex between"><h4>${E(a.name||'Actividad')}</h4>${a.source==='activity'?`<div class="btn-row"><button class="mini-icon-btn" data-action="edit-activity" data-id="${a.id}" data-event="${e.id}">✎</button><button class="mini-icon-btn danger" data-action="remove-activity" data-id="${a.id}" data-event="${e.id}">✕</button></div>`:'<span class="pill">Desde jornada</span>'}</div><p>⌖ ${E(a.place||chosenDay?.place||'Lugar por definir')} · ♙ ${E(a.role||'Responsable por definir')} ${a.status?'· '+E(a.status):''}</p>${a.description?`<p>${E(a.description)}</p>`:''}</div>`).join('')}</div>`:`<div class="empty">Esta jornada aún no tiene actividades. Agrega una para construir el Time Table.</div>`}</div><div class="card" style="margin-top:18px"><div class="section-title"><h2>Resumen de programación</h2><span class="pill">${visibleDays.length} jornadas</span></div><div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Sucursal</th><th>Horario</th><th>Actividades</th><th>Montaje</th><th>Desmontaje</th></tr></thead><tbody>${visibleDays.map(d=>`<tr><td>${xdate(d.date)}</td><td>${E(rowObject(e,'venues',d.venueId)?.name||'—')}</td><td>${E(d.start||'—')} – ${E(d.end||'—')}</td><td>${e.activities.filter(a=>a.dayId===d.id).length}</td><td>${E(d.mountStart||'—')}</td><td>${E(d.teardownStart||'—')}</td></tr>`).join('')||'<tr><td colspan="6">Sin jornadas.</td></tr>'}</tbody></table></div></div>`}
function renderModal(){const layer=document.getElementById('modal-layer');let m=ui.modal,p=ui.modalData||{},e=evById(p.eventId)||getEv();let content='';if(m==='options'){content=`<h2>Opciones de ficha</h2><p class="muted small">${E(e?.name||'Ficha')} · ${E(e?.folio||'')}</p><div class="rows"><button class="btn" data-action="duplicate" data-id="${e.id}">⧉ Duplicar como plantilla</button><button class="btn" data-action="export-event" data-id="${e.id}">⇩ Exportar archivo Ágora JSON</button><button class="btn" data-action="audit" data-id="${e.id}">◷ Historial y versiones</button><button class="btn" data-action="archive" data-id="${e.id}">${e.archived?'↻ Desarchivar':'▤ Archivar'}</button><button class="btn danger" data-action="delete" data-id="${e.id}">✕ Mover a papelera</button></div>`}
if(m==='catalog-add'){let kind=p.kind==='project'?'project':'staff';content=`<h2>Agregar ${kind==='project'?'proyecto':'personal'}</h2><form id="catalog-form"><div class="form-grid">${kind==='project'?`<div class="field"><label>ID de proyecto *</label><input name="id" required placeholder="DVM-2026-0001"></div><div class="field"><label>Nombre de proyecto *</label><input name="name" required></div><div class="field"><label>Cuenta / Cliente</label><input name="account"></div><div class="field"><label>Campaña</label><input name="campaign"></div><div class="field"><label>Coordinador</label><input name="coordinator"></div><div class="field"><label>Presentación (URL)</label><input name="presentation" type="url"></div>`:`<div class="field"><label>ID de personal *</label><input name="id" required></div><div class="field"><label>Nombre completo *</label><input name="name" required></div><div class="field"><label>Rol usual</label><select name="role">${opt(ROLES,'')}</select></div><div class="field"><label>Teléfono</label><input name="phone" type="tel"></div>`}</div><div class="btn-row" style="margin-top:20px"><button class="btn primary" type="submit">Guardar en catálogo</button></div></form>`}
if(m==='activity'){let a=p.id?rowObject(e,'activities',p.id):null;content=`<h2>${a?'Editar':'Agregar'} actividad al Time Table</h2><p class="muted small">Cada actividad se vincula a una jornada para actualizar automáticamente el cronograma.</p><form id="activity-form"><div class="form-grid"><div class="field wide"><label>Jornada / Sucursal *</label><select name="dayId" required>${opt(reqOptions(e),a?.dayId||p.dayId,'Seleccionar jornada')}</select></div><div class="field"><label>Actividad *</label><input name="name" value="${E(a?.name||'')}" required placeholder="Ej. Degustación"></div><div class="field"><label>Tipo</label><select name="category">${opt(['Activación','Volanteo','Entrega','Montaje','Desmontaje','Logística','Briefing','Otro'],a?.category||'Activación','')}</select></div><div class="field"><label>Hora de inicio *</label><input type="time" name="start" required value="${E(a?.start||'')}"></div><div class="field"><label>Hora de término</label><input type="time" name="end" value="${E(a?.end||'')}"></div><div class="field"><label>Lugar específico</label><input name="place" value="${E(a?.place||'')}" placeholder="Stand, sucursal, andén..."></div><div class="field"><label>Responsable / Rol</label><input name="role" value="${E(a?.role||'')}" placeholder="Ej. Supervisor"></div><div class="field wide"><label>Breve descripción</label><textarea name="description">${E(a?.description||'')}</textarea></div><div class="field"><label>Estado</label><select name="status">${opt(['Programada','En curso','Completada','Cancelada'],a?.status||'Programada','')}</select></div></div><div class="btn-row" style="margin-top:20px"><button class="btn primary" type="submit">${a?'Guardar cambios':'Agregar actividad'}</button><button class="btn" type="button" data-action="close-modal">Cancelar</button></div></form>`}
if(m==='copy-activities'){let d=rowObject(e,'days',p.dayId);content=`<h2>Copiar actividades</h2><p class="small muted">Origen: ${xdate(d?.date)}. Se duplicarán las actividades en otra jornada, conservando horas y descripciones.</p><form id="copy-form"><div class="field"><label>Jornada de destino *</label><select name="dest" required>${opt(reqOptions(e).filter(x=>x.value!==p.dayId),'','Seleccionar destino')}</select></div><div class="btn-row" style="margin-top:19px"><button class="btn primary" type="submit">Copiar actividades</button></div></form>`}
if(m==='audit'){let entries=db.audit.filter(a=>a.eventId===e.id).slice(0,70);content=`<h2>Historial y versiones</h2><p class="muted small">${E(e.folio)} · Registro de cambios guardado en este navegador.</p><h3 class="subsection">Versiones (${e.versions.length})</h3>${e.versions.length?e.versions.map(v=>`<div class="dash-activity"><span class="dot"></span><div style="flex:1"><strong class="small">${E(v.reason)}</strong><div class="tiny muted">${xdatetime(v.at)}</div></div><button class="btn compact" data-action="restore-version" data-id="${v.id}" data-event="${e.id}">Restaurar</button></div>`).join(''):'<div class="small muted">No hay versiones guardadas manualmente.</div>'}<h3 class="subsection">Registro de modificaciones</h3><div style="max-height:300px;overflow:auto">${entries.map(a=>`<div class="dash-activity"><div class="dot"></div><div><strong class="small">${E(a.what)}</strong><div class="tiny muted">${xdatetime(a.at)} · ${E(short(a.details,160))}</div></div></div>`).join('')}</div>`}

function buildAgoraPackage(e){

}

async function parseCsvRecords(text){
 const raw=String(text||'').replace(/^\uFEFF/,'');
 const head=raw.slice(0,2000);const delimiters=[',',';','\t'];
 const score=d=>(head.split('\n')[0].match(new RegExp(d==='\t'?'\\t':d===';'?';':',','g'))||[]).length;
 const delim=delimiters.sort((a,b)=>score(b)-score(a))[0];
 let rows=[],row=[],cell='',quoted=false;
 for(let i=0;i<raw.length;i++){let c=raw[i];if(c==='"'){if(quoted&&raw[i+1]==='"'){cell+='"';i++}else quoted=!quoted}
 else if(c===delim&&!quoted){row.push(cell.trim());cell=''}
 else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}
 row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);
 if(!rows.length)return[];const headers=rows.shift().map(v=>v.trim());
 return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]||''])));
}
function normalizeAgoraProjects(payload){
 let source=Array.isArray(payload)?payload:payload?.projects||payload?.proyectos||payload?.data?.projects||payload?.data?.proyectos||payload?.records||payload?.items;
 if(!Array.isArray(source))throw Error('No se encontró una lista de proyectos. Usa la plantilla CSV/JSON incluida.');
 const pick=(r,...keys)=>{for(const k of keys){const v=r[k];if(typeof v==='string'||typeof v==='number'){if(String(v).trim())return String(v).trim()}}return ''};
 const clean=source.map(r=>({id:pick(r,'id','ID','projectId','project_id','proyecto_id','ID proyecto','ID Proyecto','id_proyecto','folio'),name:pick(r,'name','nombre','projectName','nombre_proyecto','Nombre proyecto','Proyecto','proyecto','title'),account:pick(r,'account','cliente','cuenta','client','Cliente','Cuenta'),campaign:pick(r,'campaign','campaña','campana','Campaña'),coordinator:pick(r,'coordinator','responsable','responsable_agencia','coordinador','Responsable'),presentation:pick(r,'presentation','presentacion','url_presentacion','presentación','Presentación'),status:pick(r,'status','estado','estatus','Estado'),sourceSystem:'AGORA',source:'Importación de exportación atribuida a Ágora; pendiente de validación en línea'})).filter(r=>r.id&&r.name);

case'duplicate-activities':if(id)openModal('copy-activities',{eventId:ui.programEvent,dayId:id});return;
case'options':openModal('options',{eventId:id});return;
case'duplicate':{let original=evById(id);if(!original)return;closeModal();db.seq++;let clone=JSON.parse(JSON.stringify(original));const oldId=clone.id;clone.id=uid('ev');clone.folio=`DVM-EVT-${new Date().getFullYear()}-${String(db.seq).padStart(4,'0')}`;clone.name=clone.name+' (copia)';clone.createdAt=now();clone.updatedAt=now();clone.status='Borrador';clone.deleted=false;clone.archived=false;clone.versions=[];clone.assignments=clone.assignments.map(a=>({...a,personId:'',name:'',phone:''}));clone.checklist=clone.checklist.map(c=>({...c,done:false}));db.events.unshift(clone);logChange(clone.id,'Duplicación',`Plantilla basada en ${oldId}. Revisar fechas y personal.`);ui.eventId=clone.id;ui.step=0;ui.view='wizard';render();toast('Ficha duplicada. Revisa las fechas antes de publicarla.');return}
case'archive':{let target=evById(id);if(!target)return;target.archived=!target.archived;target.status=target.archived?'Archivada':'Borrador';logChange(id,target.archived?'Archivado':'Restauración de archivo',target.folio);closeModal();changeView('events');return}
case'delete':openModal('confirm',{title:'Mover ficha a papelera',message:'La ficha dejará de aparecer en la operación activa; podrás recuperarla desde Papelera.',eventId:id,confirmLabel:'Mover a papelera',kind:'delete'});return;
case'confirm-yes':{let p=ui.modalData;if(p.kind==='delete'){let target=evById(p.eventId);target.deleted=true;target.deletedAt=now();logChange(target.id,'Eliminación lógica','Movida a papelera');closeModal();changeView('events');toast('Ficha movida a papelera.')}return}
case'restore':{let target=evById(id);target.deleted=false;delete target.deletedAt;logChange(id,'Restauración','Recuperada de papelera');render();return}
case'audit':openModal('audit',{eventId:id});return;
case'restore-version':{let target=evById(b.dataset.event),v=target.versions.find(v=>v.id===id);if(!v)return;if(!confirm(`¿Restaurar versión del ${xdatetime(v.at)}? Se guardará una copia de la versión actual antes.`))return;let oldVersions=target.versions;snapshot(target,'Versión antes de restauración');let copy=JSON.parse(JSON.stringify(v.data));Object.assign(target,copy,{versions:oldVersions});logChange(target.id,'Restauración de versión',v.id);closeModal();render();toast('Versión restaurada.');return}
case'close-modal':closeModal();return;
case'catalog-add':openModal('catalog-add',{kind:b.dataset.kind});return;
case'catalog-delete':{let kind=b.dataset.kind,id=b.dataset.id,list=kind==='project'?'projects':'staff';if(!confirm('¿Eliminar este registro del catálogo local?'))return;db[list]=db[list].filter(x=>x.id!==id);persist();render();return}
case'backup':exportBackup();return;case'export-catalog':exportCatalog();return;case'import':readImport('event');return;case'import-agora-projects':importAgoraProjects();return;case'import-staff':readImport('staff');return;case'export-agora':exportAgora();return;case'export-event':exportEvent(id);return;case'export-csv':exportCsv(evById(id)||evById(ui.programEvent)||e);return;
case'export-html':if(e)exportHtml(e);return;case'export-image':if(e)exportImage(e);return;case'print':if(e)printDoc(e);return;
case'check-template':if(e){for(const [phase,names] of [['Montaje',['Confirmar permisos de ingreso','Verificar vehículo, materiales y herramientas','Revisar anclajes y seguridad','Realizar prueba de equipo e iluminación','Entregar área lista al supervisor']],['Desmontaje',['Validar inventario y recuperación de materiales','Desconectar y asegurar equipos','Retirar estructura y herramientas','Limpiar espacio','Confirmar entrega del área']]]){if((phase==='Montaje'&&e.requiresMount)||(phase==='Desmontaje'&&e.requiresTeardown))names.forEach(name=>{if(!e.checklist.some(x=>x.phase===phase&&x.label===name))e.checklist.push({...record('checklist',e),phase,label:name})})}logChange(e.id,'Plantilla de checklist','Se agregaron tareas sugeridas');render()}return;
}}
function handleSubmit(form){if(form.id==='catalog-form'){let f=new FormData(form),p=Object.fromEntries(f.entries()),kind=ui.modalData?.kind||'staff',list=kind==='project'?'projects':'staff';p.id=(p.id||'').trim();p.name=(p.name||'').trim();if(!p.id||!p.name){toast('ID y nombre son obligatorios.','error');return}if(db[list].some(x=>x.id.toLowerCase()===p.id.toLowerCase())){toast('Ese ID ya existe en el catálogo.','error');return}if(kind==='project'){p.sourceSystem='MANUAL';p.source='Captura manual, pendiente de validación con Ágora'}db[list].push(p);persist();closeModal();render();toast('Registro añadido al catálogo.');return}
if(form.id==='activity-form'){let meta=ui.modalData,e=evById(meta.eventId),data=Object.fromEntries(new FormData(form).entries());if(!data.dayId||!data.start||!data.name){toast('Completa jornada, actividad y hora.','error');return}if(data.end&&data.end<data.start){toast('La hora final es anterior a la inicial. Comprueba si es una actividad nocturna.','error')}if(meta.id){Object.assign(rowObject(e,'activities',meta.id),data);logChange(e.id,'Edición de actividad',`${data.name} · ${data.start}`)}else{e.activities.push({id:uid('act'),...data});logChange(e.id,'Creación de actividad',`${data.name} · ${data.start}`)}ui.programEvent=e.id;updateCalendarOnDay(e,data.dayId);closeModal();ui.view='schedule';render();toast('Time Table actualizado.');return}
if(form.id==='copy-form'){const meta=ui.modalData,e=evById(meta.eventId),dest=new FormData(form).get('dest'),src=meta.dayId;if(!dest)return;let activities=e.activities.filter(a=>a.dayId===src);activities.forEach(a=>e.activities.push({...a,id:uid('act'),dayId:dest,status:'Programada'}));logChange(e.id,'Copia de actividades',`${activities.length} actividades duplicadas a otra jornada`);closeModal();updateCalendarOnDay(e,dest);render();toast(`${activities.length} actividades copiadas.`);return}}
document.addEventListener('click',ev=>{const button=ev.target.closest('[data-action]');if(button){ev.preventDefault();executeAction(button);return}if(ev.target.dataset.closeOverlay){closeModal()}});
document.addEventListener('submit',ev=>{if(['catalog-form','activity-form','copy-form'].includes(ev.target.id)){ev.preventDefault();handleSubmit(ev.target)}});
document.addEventListener('focusin',ev=>{const el=ev.target;if(el.dataset.field)el.dataset.original=el.type==='checkbox'?String(el.checked):el.value});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.field){let [group,id,key]=el.dataset.field.split('.');if(group==='event')key=id;const e=getEv(),target=group==='event'?e:rowObject(e,group,id);if(target){target[key]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value)||0:el.value;e.updatedAt=now();saveSoon()}}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.field){let [group,id,key]=el.dataset.field.split('.');if(group==='event')key=id;const e=getEv(),target=group==='event'?e:rowObject(e,group,id);if(target){let before=el.dataset.original,after=el.type==='checkbox'?String(el.checked):el.value;handleField(el);if(before!==undefined&&before!==after)logChange(e.id,'Cambio de campo',`${group}.${key}: ${short(before,60)} → ${short(after,60)}`);if(group==='requirements'&&['qty','role','dayId'].includes(key))deferRender()}}else if(el.id==='event-filter'){ui.eventFilter=el.value;render()}else if(el.id==='event-search'){ui.search=el.value;render()}else if(el.id==='program-event'){ui.programEvent=el.value;ui.activeDay='';ui.activeVenue='all';let e=evById(ui.programEvent);if(e?.days.length)updateCalendarOnDay(e,e.days[0].id);render()}else if(el.id==='program-venue'){ui.activeVenue=el.value;ui.activeDay='';render()}else if(el.dataset.special==='event-status'){let e=getEv(),old=e.status;e.status=el.value;e.archived=e.status==='Archivada';logChange(e.id,'Estado',`${old} → ${e.status}`);render()}else if(el.dataset.special==='staff-select'){ui.staffSelect=el.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal)closeModal();if(ev.key==='Enter'&&ev.target.id==='event-search'){ui.search=ev.target.value;render()}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();

</script>
</body></html>
