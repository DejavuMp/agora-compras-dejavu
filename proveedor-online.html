<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171411">
<title>ÁGORA · Respuesta de proveedor · Dejavú Marketing</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#26231c;background:#f3f2ef}*{box-sizing:border-box}
body{margin:0}.brand{background:#171411;color:#f7eee0;padding:22px max(22px,calc((100vw - 980px)/2))}
.brand strong{color:#d8b477;font-size:29px;letter-spacing:2px}.brand small{display:block;font-size:11px;letter-spacing:2px;margin-top:5px}
main{max-width:980px;margin:25px auto 55px;padding:0 18px}.card{background:#fff;border:1px solid #e6dfd2;border-radius:13px;margin-bottom:15px;box-shadow:0 3px 15px #00000009;padding:22px}
h1{font-size:27px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}.muted{color:#766f64}p{line-height:1.55}.status{font-weight:bold;color:#7d5924}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.field label{font-size:12px;font-weight:bold}
input,select,textarea{font:14px Arial,sans-serif;border:1px solid #d7cfc0;border-radius:7px;padding:10px;width:100%;background:#fff;color:#221d18}textarea{resize:vertical;min-height:78px}
.item{padding:14px 0;border-top:1px solid #ebe7df}.item:first-child{border-top:0}.itemhead{display:flex;gap:12px;align-items:flex-start}.item img{width:96px;height:96px;object-fit:contain;border-radius:6px;border:1px solid #eee}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}button{cursor:pointer;border:1px solid #b28d50;color:#473720;background:#fff;border-radius:8px;padding:12px 18px;font-weight:bold}
button.primary{background:#a57c3f;border-color:#a57c3f;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
.notice{background:#fff7e5;border:1px solid #e4d0a6;border-radius:8px;padding:13px}footer{text-align:center;padding:18px;color:#807869;font-size:12px}
[hidden]{display:none!important}#busy{color:#8b6838}
@media(max-width:650px){.grid{grid-template-columns:1fr}main{margin:13px auto}.card{padding:17px}h1{font-size:23px}}
</style>
</head>
<body>
<header class="brand"><strong>ÁGORA</strong><small>DEJAVÚ MARKETING · COMPRAS & PRODUCCIÓN</small></header>
<main>
<div class="card">
<h1 id="header-title">Respuesta de proveedor</h1>
<p id="subtitle" class="muted">Abriendo tu solicitud segura…</p>
<p id="busy" role="status" aria-live="polite"></p>
</div>
<section id="content"></section>
</main>
<footer>Dejavú Marketing · Este formulario se guarda directamente en línea. No requiere descargar ni enviar archivos.</footer>
<script type="module" src="./proveedor-online.js"></script>
</body>
</html>
