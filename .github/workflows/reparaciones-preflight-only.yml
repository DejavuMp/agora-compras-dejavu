name: "ÁGORA Reparaciones · Preflight real solo lectura"
on:
  push:
    branches: ["feature/agora-reparaciones-permisos-20261123"]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "security/storage-before-reparaciones.rules"
      - ".github/firebase-staff/safe-rules-preflight.mjs"
      - ".github/firebase-staff/safe-storage-preflight.mjs"
      - ".github/workflows/reparaciones-preflight-only.yml"
permissions:
  contents: read
  id-token: write
jobs:
  verify-live:
    name: "Comparar reglas vigentes sin publicar"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_PROJECT_ID: agora-dejavu-38b8c
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar federación autorizada, sin mostrar credenciales
        env:
          WIF_PROVIDER: ${{ vars.DEJAVU_FIREBASE_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.DEJAVU_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::Falta configurar federación WIF y cuenta de servicio en este repositorio."
            exit 1
          fi
          echo "La configuración WIF del repositorio está presente."
      - id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: agora-dejavu-38b8c
          workload_identity_provider: ${{ vars.DEJAVU_FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.DEJAVU_FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: "600s"
      - name: Verificar Firebase Firestore real SIN MODIFICACIONES
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/safe-rules-preflight.mjs
      - name: Verificar Firebase Storage real SIN MODIFICACIONES
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/safe-storage-preflight.mjs
