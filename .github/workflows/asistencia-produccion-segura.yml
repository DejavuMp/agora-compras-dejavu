name: "ÁGORA · Asistencia con respaldo y publicación segura"
# El proveedor Google WIF autoriza exclusivamente activaciones manuales.
# No intentar autenticarse desde eventos push: produce unauthorized_client.
on:
  workflow_dispatch:
    inputs:
      project_confirmation:
        description: "Confirmar proyecto agora-dejavu-38b8c"
        required: true
        type: string
concurrency:
  group: agora-asistencia-firestore-produccion
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  rules-preflight:
    name: "Respaldar y publicar SOLO ampliación segura de asistencia"
    if: github.ref == 'refs/heads/main' && inputs.project_confirmation == 'agora-dejavu-38b8c'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: agora-dejavu-38b8c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Confirmar identidad federada configurada
        env:
          WIF_PROVIDER: ${{ vars.DEJAVU_FIREBASE_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.DEJAVU_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::No hay identidad federada. No se modificó producción."
            exit 1
          fi
      - id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: agora-dejavu-38b8c
          workload_identity_provider: ${{ vars.DEJAVU_FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.DEJAVU_FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: "1800s"
      - name: Consultar reglas REALES, comprobar solo adición, respaldar o detener
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/prepare-attendance-rules.mjs
      - name: Guardar reglas reales y versión ANTES de escribir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-obligatorio-asistencia-firestore
          path: .github/firebase-staff/.preflight/attendance/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependencias de emulador (sin datos reales)
        run: npm install --no-save 'firebase@^12.0.0' '@firebase/rules-unit-testing@^5.0.0' firebase-tools
      - name: Probar permisos que se van a activar en emulador aislado
        run: npx firebase emulators:exec --only firestore --project demo-agora-asistencia --non-interactive 'node .github/firebase-staff/test-attendance-rules.mjs'
      - name: Confirmar que producción no cambió desde el respaldo
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/prepare-attendance-rules.mjs --check-before-write
      - name: Publicar exclusivamente reglas Firestore cuando base coincida
        if: env.ATTENDANCE_DEPLOY_MODE == 'deploy'
        run: npx firebase deploy --only firestore:rules --project agora-dejavu-38b8c --non-interactive
      - name: Confirmar publicación exacta en Firebase
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/prepare-attendance-rules.mjs --verify
