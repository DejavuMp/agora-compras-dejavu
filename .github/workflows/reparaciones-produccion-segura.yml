name: "ÁGORA · Activación única de Reparaciones con respaldo"
on:
  push:
    branches: [main]
    paths:
      - "security/storage-before-reparaciones.rules"
      - ".github/workflows/reparaciones-produccion-segura.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Auditar reglas vigentes o publicar después de conciliarlas"
        required: true
        type: choice
        default: audit
        options:
          - audit
          - publish_spark
      project_confirmation:
        description: "Confirma el proyecto agora-dejavu-38b8c"
        required: true
        type: string
concurrency:
  group: agora-reparaciones-produccion-exclusiva
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  diagnose-oidc:
    name: "Diagnóstico OIDC de GitHub sin acceder a Google Cloud"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mostrar únicamente claims públicos para revisar IAM (nunca el token)
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.parse
          url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          audience="//iam.googleapis.com/projects/775680965171/locations/global/workloadIdentityPools/agora-github-actions/providers/github-actions"
          sep="&" if "?" in url else "?"
          url+=sep+"audience="+urllib.parse.quote(audience,safe="")
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req,timeout=15) as res:
              jwt=json.load(res)["value"]
          data=jwt.split(".")[1]
          payload=json.loads(base64.urlsafe_b64decode(data+"="*(-len(data)%4)))
          for key in ["repository","repository_id","repository_owner","ref","event_name","workflow","workflow_ref","sub","job_workflow_ref","runner_environment"]:
              print(f"{key}: {payload.get(key,'(sin valor)')}")
          print("Diagnóstico finalizado: JWT no mostrado ni guardado; ningún recurso Firebase fue consultado.")
          PY
  audit-live-rules:
    name: "Auditoría de reglas reales, sin ninguna publicación"
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit' && inputs.project_confirmation == 'agora-dejavu-38b8c' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: agora-dejavu-38b8c
    steps:
      - uses: actions/checkout@v4
      - id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: agora-dejavu-38b8c
          workload_identity_provider: ${{ vars.DEJAVU_FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.DEJAVU_FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: "600s"
      - name: Leer y respaldar reglas activas de Firestore (comparación segura)
        id: firestore_audit
        continue-on-error: true
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/safe-rules-preflight.mjs
      - name: Leer y respaldar reglas activas de Storage (comparación segura)
        id: storage_audit
        continue-on-error: true
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/safe-storage-preflight.mjs
      - name: Diagnosticar bucket y release Storage existentes sin crear recursos
        if: always()
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/diagnose-storage-release.mjs
      - name: Crear resumen de diferencias sin datos de producción en logs
        if: always()
        run: node .github/firebase-staff/report-repair-rule-differences.mjs
      - name: Guardar respaldo original y diagnóstico (solo para conciliación)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-reglas-reales-agora-reparaciones
          path: .github/firebase-staff/.preflight/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
  predeploy-tests:
    name: "Probar respaldos y permisos sin producción"
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish_spark')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          node .github/firebase-staff/test-preflight.mjs
          node .github/firebase-staff/test-storage-preflight.mjs
          node .github/firebase-staff/test-bucket-cors.mjs
          node .github/firebase-staff/test-spark-idempotence.mjs
      - name: Probar roles de reparaciones con Firestore de prueba
        run: |
          npm install --no-save 'firebase@^12.0.0' '@firebase/rules-unit-testing@^5.0.0' firebase-tools
          npx firebase emulators:exec --only firestore --project demo-agora-repairs --non-interactive 'node .github/firebase-staff/test-repair-rules.mjs'
      - name: Probar fotografías con Storage de prueba
        run: npx firebase emulators:exec --only firestore,storage --project demo-agora-repairs-storage --non-interactive 'node .github/firebase-staff/test-repair-storage-rules.mjs'
  activate-spark:
    name: "Activar SOLO Firestore Spark (sin facturación ni Cloud Storage)"
    needs: predeploy-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'publish_spark' && inputs.project_confirmation == 'agora-dejavu-38b8c'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: agora-dejavu-38b8c
    steps:
      - uses: actions/checkout@v4
      - id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: agora-dejavu-38b8c
          workload_identity_provider: ${{ vars.DEJAVU_FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.DEJAVU_FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: "600s"
      - name: Respaldar Firestore real y preparar reglas aditivas Spark
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/prepare-spark-firestore-release.mjs
      - name: Guardar respaldo obligatorio ANTES del despliegue
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-firestore-spark-antes-de-reparaciones
          path: .github/firebase-staff/.preflight/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar herramientas de emulación y publicación
        run: npm install --no-save 'firebase@^12.0.0' '@firebase/rules-unit-testing@^5.0.0' firebase-tools
      - name: Probar reglas fusionadas que realmente se van a publicar
        run: npx firebase emulators:exec --only firestore --project demo-agora-repairs --non-interactive 'node .github/firebase-staff/test-repair-rules.mjs'
      - name: Publicar exclusivamente reglas Firestore cuando falte el módulo
        if: env.AGORA_SPARK_ACTION == 'deploy'
        run: npx firebase deploy --only firestore:rules --project agora-dejavu-38b8c --non-interactive
      - name: Confirmar que las reglas ya estaban activadas (sin republicar)
        if: env.AGORA_SPARK_ACTION == 'already_installed'
        run: echo "Reparaciones Spark ya estaba activado. Sin nuevas escrituras en Firebase."
      - name: Confirmar que las reglas publicadas coinciden con las aprobadas
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .github/firebase-staff/prepare-spark-firestore-release.mjs --verify
