name: "ÁGORA Reparaciones · Exportación técnica de reglas candidatas"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reparaciones-audit-export.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar exclusivamente reglas versionadas (sin credenciales)
        uses: actions/upload-artifact@v4
        with:
          name: agora-reglas-candidatas-repositorio
          path: |
            firestore.rules
            storage.rules
            security/storage-before-reparaciones.rules
          retention-days: 1
          if-no-files-found: error
