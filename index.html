*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.47}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{color:#262625;outline:none;max-width:100%}input:focus,select:focus,textarea:focus{border-color:#b79959!important;box-shadow:0 0 0 3px rgba(189,148,75,.13)}::placeholder{color:#aaaba8}h1,h2,h3,h4,p{margin:0}h1{font-size:27px;letter-spacing:-.8px}h2{font-size:19px;letter-spacing:-.35px}h3{font-size:15px}p{line-height:1.55}.small{font-size:12px}.xs{font-size:11px}.muted{color:var(--muted)}.caps{text-transform:uppercase;letter-spacing:1.8px;font-size:10px;font-weight:700}.money{font-variant-numeric:tabular-nums}.mono{font-variant-numeric:tabular-nums;letter-spacing:.2px}.gap8{display:flex;gap:8px;align-items:center}.gap12{display:flex;gap:12px;align-items:center}.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}.grow{flex:1}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt22{margin-top:22px}.mb14{margin-bottom:14px}.right{text-align:right}.hidden{display:none!important}.nowrap{white-space:nowrap}
.shell{min-height:100dvh;display:grid;grid-template-columns:245px minmax(0,1fr)}.side{background:#121310;color:#e6e5df;padding:24px 14px 22px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;border-right:1px solid #34332c;z-index:15}.side::before{content:'';position:absolute;left:0;right:0;top:0;height:220px;background:linear-gradient(180deg,rgba(190,148,75,.09),transparent);pointer-events:none}.brand{padding:5px 12px 25px;display:flex;gap:11px;align-items:center}.brand-symbol{height:40px;width:39px;border:1px solid #927038;display:grid;place-items:center;color:#edc06b;font-size:32px;font-weight:700;line-height:1;background:linear-gradient(135deg,#28231a,#141311);border-radius:12px}.brand-name{font-size:21px;letter-spacing:3px;font-family:Georgia,serif;color:#e2bf75}.brand-sub{font-size:9px;color:#a89c82;letter-spacing:1.35px;margin-top:-2px}.side-rule{height:1px;background:#38352d;margin:0 12px 18px}.side-label{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#8e8d80;font-weight:700;margin:12px 12px 10px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#bcbcb4;text-align:left;border-radius:11px;padding:12px;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:600;transition:.15s}.nav button:hover{background:#25251f;color:#fff}.nav button.active{background:linear-gradient(90deg,#3e3627,#27251e);color:#f7e3bc;box-shadow:inset 3px 0 #d6a859}.nav button svg{width:18px;height:18px;stroke-width:1.7}.nav button .count{margin-left:auto;background:#2d2c25;border-radius:20px;color:#e7c783;padding:2px 7px;font-size:10px}.side-bottom{margin-top:auto;padding:16px 12px 0;border-top:1px solid #39362e;color:#868478;font-size:11px}.side-bottom strong{display:block;color:#d5cfc0;font-size:12px;margin-bottom:5px}.main{min-width:0}.topbar{height:74px;padding:0 34px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10}.crumb{display:flex;align-items:center;gap:10px}.crumb .app-name{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#ad8644}.crumb .sep{color:#c5c2bb}.crumb strong{font-size:13px}.topright{display:flex;align-items:center;gap:10px}.avatar{height:36px;width:36px;background:#292820;border-radius:12px;display:grid;place-items:center;color:#e2be70;font-weight:700}.content{padding:26px 34px 75px;max-width:1580px;margin:auto}.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 24px}.page-title p{color:var(--muted);margin-top:6px}.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #dcdad2;background:#fff;color:#33322f;padding:10px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;justify-content:center;font-weight:700;font-size:12px;min-height:38px;white-space:nowrap}.btn:hover{background:#f5f3ed}.btn.primary{background:#1e1e1a;color:#f5e7ca;border-color:#1e1e1a}.btn.primary:hover{background:#38352c}.btn.gold{background:#b38d49;color:#fff;border-color:#b38d49}.btn.ghost{background:transparent;border-color:transparent}.btn.danger{color:#a14a47}.btn.smallbtn{padding:6px 10px;min-height:31px;font-size:11px}.btn svg,.iconbtn svg{height:16px;width:16px;stroke-width:1.8}.iconbtn{height:35px;width:35px;display:inline-grid;place-items:center;background:white;border:1px solid var(--line);border-radius:10px;color:#777}.iconbtn:hover{color:#b38d49}.hamburger{display:none}
